---
# router-trvl — Cudy TR3000 v1 (MT7981, 256 MB), travel router.
# Per-host overrides. Shared defaults: group_vars/routers/.
# Anything defined here wins over group_vars.

# --- Identity ---
# Hostname on the device and in the tailnet (default: inventory name).
# owrt_hostname: router-trvl
# tailscale_hostname: router-trvl

# --- Network ---
# LAN IP of this router (used by /etc/config/network).
owrt_lan_ip: 192.168.102.1
# TR3000 has no DSA switch: two standalone GMACs — eth0 = 2.5G WAN,
# eth1 = 1G LAN (same layout as router-srt). Per OpenWrt board.d:
# cudy,tr3000-256mb-v1 -> ucidef_set_interfaces_lan_wan eth1 eth0.
owrt_lan_bridge_ports:
  - eth1
owrt_wan_device: eth0

# --- Location ---
owrt_timezone_name: Europe/Moscow

# --- DNS ---
# Search domain for this site:
owrt_dns_domain: trvl.home.arpa

# --- Wi-Fi ---
# MT7981 DBDC paths; verify against the stock config on the device:
#   cat /etc/config/wireless
# PSK comes from the vault: add it once with
#   ansible-vault encrypt_string '<psk>' --name vault_wireless_psk
# and append to group_vars/all/vault.yml.
# owrt_wireless_country: RU   # regulatory domain (channels/DFS)
owrt_wireless_radios:
  - name: radio0
    path: platform/soc/18000000.wifi # 2.4 GHz
    band: 2g
    channel: auto
    htmode: HE20
    ifaces:
      - ssid: trvl
        encryption: sae-mixed
        key: "{{ vault_wireless_psk }}"
  - name: radio1
    path: platform/soc/18000000.wifi+1 # 5 GHz
    band: 5g
    channel: auto
    htmode: HE80
    ifaces:
      - ssid: trvl
        encryption: sae-mixed
        key: "{{ vault_wireless_psk }}"

# --- Firewall ---
# MT7981 WED: NAT/forwarding bypasses the CPU. Incompatible with SQM and
# per-flow netfilter rules (offloaded flows skip them) — we have neither.
owrt_flow_offloading_hw: true

# --- Tailscale ---
# Advertise this site's LAN to the tailnet (matches owrt_lan_*).
tailscale_advertise_routes: "192.168.102.0/24"
# Exit node: full-tunnel internet via this WAN. Approved once in the
# Tailscale admin console (Edit route settings), or autoApprovers.exitNode.
# tailscale_advertise_exit_node: true

# --- Policy routing: MacBook-only exit node with kill switch ---
# Only the MacBook rides the exit node; the rest of the LAN stays direct
# on the WAN. tailscaled installs a blanket `5270: from all lookup 52`
# when tailscale_exit_node is set — the rules below slot in front of it
# (tailscaled occupies 5210/5230/5250 fwmark rules; 5255-5260 are free).
tailscale_exit_node: router-krm
# Keeps throw routes for the local subnet in table 52, so local traffic
# (and the MacBook's) is not eaten by the tunnel's default route.
tailscale_exit_node_allow_lan_access: true

owrt_network_rules:
  - comment: MacBook -> exit node (table 52 is tailscaled's)
    priority: 5255
    src: "192.168.102.50/32"
    lookup: "52"
  - comment: MacBook -> local LAN stays direct (table 52 throws fall through)
    priority: 5256
    src: "192.168.102.50/32"
    dest: "192.168.102.0/24"
    lookup: main
  - comment: Kill switch — no tunnel route, no WAN fallback
    priority: 5257
    src: "192.168.102.50/32"
    action: unreachable
  - comment: Replies to tailnet peers keep working (subnet router)
    priority: 5259
    src: "192.168.102.0/24"
    dest: "100.64.0.0/10"
    lookup: "52"
  - comment: Everyone else on the LAN bypasses the tunnel
    priority: 5260
    src: "192.168.102.0/24"
    lookup: main

owrt_firewall_rules:
  # Belt and suspenders: if the ip rules are ever flushed, the MacBook
  # must not leak onto the WAN.
  - {
      name: KillSwitch-MacBook-WAN,
      src: lan,
      dest: wan,
      src_ip: 192.168.102.50,
      proto: all,
      target: REJECT,
    }

# --- DHCP ---
# Fixed lease so the policy rules above can match by IP. Private Wi-Fi
# Address = Fixed on the MacBook: stable, but regenerated on macOS
# reinstall — update the MAC here then.
owrt_dhcp_hosts:
  - { name: macbook, ip: 192.168.102.50, mac: "a2:b6:27:9e:00:bd" }
