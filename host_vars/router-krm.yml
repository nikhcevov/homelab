---
# router-krm — per-host overrides. Shared defaults: group_vars/routers/.
# Anything defined here wins over group_vars.

# --- Identity ---
# Hostname on the device and in the tailnet (default: inventory name).
# owrt_hostname: router-krm
# tailscale_hostname: router-krm

# --- Network ---
# LAN IP of this router (used by /etc/config/network).
owrt_lan_ip: 192.168.100.1
# Non-default LAN size:
# owrt_lan_netmask: "255.255.255.0"
# Different hardware -> different DSA port names (`ip link` on the router):
# owrt_lan_bridge_ports:
#   - lan1
#   - lan2
#   - lan3
#   - lan4

# ISP binds the WAN lease to this MAC — without it the WAN stays down.
owrt_wan_mac: "50:ff:20:73:35:fd"

# Static leases migrated from the manual config; devices keep their IPs
# after the repo takes over /etc/config/dhcp.
owrt_dhcp_hosts:
  - { name: ipmi, ip: 192.168.100.10, mac: "ac:1f:6b:f9:82:8a" }
  - { name: unraid, ip: 192.168.100.20, mac: "ac:1f:6b:f4:a4:18" }
  - { name: ha-krm, ip: 192.168.100.30, mac: "dc:a6:32:9a:cb:1f" }
  - { name: nvr, ip: 192.168.100.40, mac: "24:28:fd:3e:1e:f5" }

# --- Location ---
owrt_timezone_name: Europe/Moscow

# --- DNS ---
# Search domain for this site:
owrt_dns_domain: krm.home.arpa

# --- Tailscale ---
# Advertise this site's LAN to the tailnet (matches owrt_lan_*).
tailscale_advertise_routes: "192.168.100.0/24"
# Exit node: full-tunnel internet via this WAN. Approved once in the
# Tailscale admin console (Edit route settings), or autoApprovers.exitNode.
tailscale_advertise_exit_node: true
