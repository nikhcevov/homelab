  - uid: fg4kec23nsydcc
    title: Scrape target down
    condition: B
    data:
    - refId: A
      queryType: ''
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: PBFA97CFB590B2093
      model:
        expr: up{job=~"prometheus|node-pve|node-docker|smartctl-pve|cadvisor|pve|nut"} == 0
        hide: false
        intervalMs: 1000
        maxDataPoints: 43200
        refId: A
    - refId: B
      queryType: ''
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        conditions:
        - evaluator:
            params:
            - 0
            type: gt
          operator:
            type: and
          query:
            params:
            - A
          reducer:
            params: []
            type: last
          type: query
        datasource:
          type: __expr__
          uid: __expr__
        hide: false
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        type: classic_conditions
    noDataState: OK
    executionErrorState: Error
    for: 5m
    annotations:
      summary: A scrape target has been down for 5 minutes
    labels:
      component: Monitor
      severity: critical
    isPaused: false
