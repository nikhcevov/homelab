apiVersion: 1
groups:
- orgId: 1
  name: homelab
  folder: Homelab Alerts
  interval: 60s
  rules:
  - uid: fg4kec23nsydcc
    title: Scrape target down
    condition: B
    data:
    - refId: A
      queryType: ''
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: PBFA97CFB590B2093
      model:
        expr: up{job=~"prometheus|node-pve|node-docker|smartctl-pve|cadvisor|pve|nut"} == 0
        hide: false
        intervalMs: 1000
        maxDataPoints: 43200
        refId: A
    - refId: B
      queryType: ''
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        conditions:
        - evaluator:
            params:
            - 0
            type: gt
          operator:
            type: and
          query:
            params:
            - A
          reducer:
            params: []
            type: last
          type: query
        datasource:
          type: __expr__
          uid: __expr__
        hide: false
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        type: classic_conditions
    noDataState: OK
    executionErrorState: Error
    for: 5m
    annotations:
      summary: A scrape target has been down for 5 minutes
      description: Prometheus cannot scrape a target.
      runbook_url: docs/runbooks/monitoring.md#scrape-target-down
    labels:
      component: Monitor
      severity: critical
    isPaused: false
    notification_settings:
      receiver: ntfy-critical
      group_by:
      - grafana_folder
      - alertname
      group_wait: 10s
      group_interval: 5m
      repeat_interval: 2h
