############## Common ##################

x-env: &default-env
  TZ: ${TZ}
  PUID: ${PUID}
  PGID: ${PGID}

x-common: &common
  restart: unless-stopped
  mem_limit: 512m
  environment:
    <<: *default-env
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "1"

############## Services ##################

services:
  qbittorrent:
    <<: *common
    image: ghcr.io/linuxserver/qbittorrent:14.3.9.99202110311443-7435-01519b5e7ubuntu20.04.1-ls166@sha256:751f377e7bcfe8e7aee1d219049720690510f488bba649f8ceffcd911e83d908
    container_name: qbittorrent
    mem_limit: 1536m
    ports:
      - "127.0.0.1:8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
    environment:
      <<: *default-env
      WEBUI_PORT: 8080
      TORRENTING_PORT: 6881
    volumes:
      - ${APPDATA}/qbittorrent:/config
      - ${TORRENTS}:/data/torrents

  prowlarr:
    <<: *common
    image: ghcr.io/linuxserver/prowlarr:3.0.2.5780-ls169@sha256:45117ba8439e2337a92ffe38a451a4dafc0be771754d05d88cdf102419d09646
    container_name: prowlarr
    ports:
      - "127.0.0.1:9696:9696"
    volumes:
      - ${APPDATA}/prowlarr:/config

  sonarr:
    <<: *common
    image: ghcr.io/linuxserver/sonarr:5.14-2.0.0.5344-ls15@sha256:df3c854a38dcc001f2b87cf44a101d9da52cb22c22dcbaf135f825d9c9d0a844
    container_name: sonarr
    ports:
      - "127.0.0.1:8989:8989"
    volumes:
      - ${APPDATA}/sonarr:/config
      - ${DATA}:/data

  sonarr-anime:
    <<: *common
    image: ghcr.io/linuxserver/sonarr:5.14-2.0.0.5344-ls15@sha256:df3c854a38dcc001f2b87cf44a101d9da52cb22c22dcbaf135f825d9c9d0a844
    container_name: sonarr-anime
    ports:
      - "127.0.0.1:8990:8989"
    volumes:
      - ${APPDATA}/sonarr-anime:/config
      - ${DATA}:/data

  radarr:
    <<: *common
    image: ghcr.io/linuxserver/radarr:7.0.3.10918-ls328@sha256:044788f5508b7f67a3e0368cdd142c77c4d4cd5aec2efaba53e1a68b6b6231e7
    container_name: radarr
    ports:
      - "127.0.0.1:7878:7878"
    volumes:
      - ${APPDATA}/radarr:/config
      - ${DATA}:/data

  radarr-anime:
    <<: *common
    image: ghcr.io/linuxserver/radarr:7.0.3.10918-ls328@sha256:044788f5508b7f67a3e0368cdd142c77c4d4cd5aec2efaba53e1a68b6b6231e7
    container_name: radarr-anime
    ports:
      - "127.0.0.1:7879:7878"
    volumes:
      - ${APPDATA}/radarr-anime:/config
      - ${DATA}:/data

  bazarr:
    <<: *common
    image: ghcr.io/linuxserver/bazarr:v1.6.2-ls373@sha256:e0c5d45965242830c5eeddaafe9ae2b5e8ca3f6c01ecda9ee9364f550921dc50
    container_name: bazarr
    ports:
      - "127.0.0.1:6767:6767"
    volumes:
      - ${APPDATA}/bazarr:/config
      - ${MEDIA}:/data/media

  jellyfin:
    <<: *common
    image: ghcr.io/linuxserver/jellyfin:12.4ubu2604-ls60@sha256:b10044530553b2506f06279bf0b5223f9534f434f87a277da4b8fa8ac386cb58
    container_name: jellyfin
    mem_limit: 1536m
    runtime: nvidia
    ports:
      - "8096:8096" # LAN discovery clients require a reachable HTTP endpoint
      - "8920:8920"
      - "1900:1900/udp"
      - "7359:7359/udp"
    environment:
      <<: *default-env
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
    volumes:
      - ${APPDATA}/jellyfin:/config
      - ${MEDIA}:/data

  seerr:
    <<: *common
    image: ghcr.io/seerr-team/seerr:v3.5.2@sha256:aadee014b40e28cf9aa4928bc9d1183a6eb08f8c44d543cddc9efdcb16549be2
    container_name: seerr
    mem_limit: 768m
    user: "${PUID}:${PGID}"
    init: true
    ports:
      - "127.0.0.1:5055:5055"
    environment:
      <<: *default-env
      PORT: 5055
      LOG_LEVEL: info
      CA_TS_FALLBACK_DIR: /app/config
    volumes:
      - ${APPDATA}/seerr:/app/config
      - ${APPDATA}/seerr/logs:/app/config/logs

  whisparr:
    <<: *common
    image: ghcr.io/hotio/whisparr:v3-3.6.2-release.1727@sha256:7c00fde3986622847592d6707ba2b1cefaab5ebc0f105cc40b69912ff7ac62f3
    container_name: whisparr
    cap_add:
      - NET_ADMIN
    ports:
      - "127.0.0.1:6969:6969"
    volumes:
      - ${APPDATA}/whisparr:/config
      - ${DATA}:/data

  clonarr:
    <<: *common
    image: ghcr.io/prophetse7en/clonarr:v3.5.0@sha256:8c3169e0d610ff5318adddbc9307ab9db8665176fc4cb559ef46c73431f1d3fa
    container_name: clonarr
    mem_limit: 128m
    ports:
      - "127.0.0.1:6060:6060"
    volumes:
      - ${APPDATA}/clonarr:/config
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:6060/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Cloudflare challenge solver for Prowlarr indexers (for example rutracker).
  flaresolverr:
    <<: *common
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2@sha256:c80ae007ce2ccdcd217a12426e4f039ef763ff90738c808d38810c3e59323767
    container_name: flaresolverr
    mem_limit: 3g
    ports:
      - "127.0.0.1:8191:8191"

  # Removes torrents whose files lost library hardlinks (deleted through Seerr).
  qbit_manage:
    image: ghcr.io/stuffanthings/qbit_manage:v4.15.0@sha256:f8db47d6533bac7c7f71d367545c5059d7228bcca188db1e059dbf4a693d8362
    container_name: qbit_manage
    restart: unless-stopped
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "1"
    # The pinned scheduler can sleep 30s before honoring its SIGTERM flag.
    stop_grace_period: 60s
    environment:
      <<: *default-env
      QBT_SCHEDULE: "1440"
      QBT_DIVIDER: "="
    volumes:
      - ${APPDATA}/qbit_manage:/config
      - ${TORRENTS}:/data/torrents
