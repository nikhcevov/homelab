name: order-manager

x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "1"

services:
  app:
    image: ghcr.io/nikhcevov/order-manager-for-wife:0.4.0@sha256:577dc9d8b1b90422f80754693ea98d6e6c7516baa83887c9202fe351362c944f
    restart: unless-stopped
    mem_limit: 256m
    logging: *logging
    init: true
    stop_grace_period: 30s
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "127.0.0.1:4893:4893"
    volumes:
      - /mnt/appdata/order-manager/media:/app/var/media
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + process.env.PORT + '/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  db:
    # Shared stock PostgreSQL pin. An 18.6 data directory must be
    # reinitialized or restored before this image can start.
    image: postgres:18.4@sha256:4aabea78cf39b90e834caf3af7d602a18565f6fe2508705c8d01aa63245c2e20
    restart: unless-stopped
    mem_limit: 256m
    logging: *logging
    env_file:
      - .env
    volumes:
      - /mnt/appdata/order-manager/data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
