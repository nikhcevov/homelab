name: order-manager

x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "1"

services:
  app:
    image: ghcr.io/nikhcevov/order-manager-for-wife:0.5.1@sha256:2501e88cc3cf7b5dc0ee33dbbf61dba4c1f58b65000b942b4e07b1ca4e70d1ba
    restart: unless-stopped
    mem_limit: 256m
    logging: *logging
    init: true
    stop_grace_period: 30s
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "127.0.0.1:4893:4893"
    volumes:
      - /mnt/appdata/order-manager/media:/app/var/media
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + process.env.PORT + '/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  db:
    # Shared stock PostgreSQL pin. An 18.6 data directory must be
    # reinitialized or restored before this image can start.
    image: postgres:18.7@sha256:64c8b0d31e4ab6ea665e8426ea406a94bf52de3c05b3a4a8bf713704eefa9328
    restart: unless-stopped
    mem_limit: 256m
    logging: *logging
    env_file:
      - .env
    volumes:
      - /mnt/appdata/order-manager/data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
