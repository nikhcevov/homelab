# Scrutiny (SMART dashboard).
#
# NOT deployed on the Docker VM: the disks live on the Proxmox host, so the
# container cannot see /dev/sd*. SMART monitoring moves to the PVE host
# (smartctl_exporter or the scrutiny collector). The file is kept as the
# migrated definition and is intentionally absent from `compose_stacks`.
services:
  scrutiny:
    container_name: scrutiny
    image: ghcr.io/starosdev/scrutiny@sha256:7de1b17227943610c4777d4d57ef1d7bbe9bcbcccc97e3b24bbc5ae3a4d8f725
    restart: unless-stopped
    ports:
      - "8085:8080"
      - "8086:8086"
    cap_add:
      - SYS_RAWIO
      - SYS_ADMIN
    devices:
      - /dev/sda:/dev/sda
      - /dev/sdb:/dev/sdb
      - /dev/sdc:/dev/sdc
      - /dev/sdd:/dev/sdd
      - /dev/sde:/dev/sde
    volumes:
      - /mnt/appdata/scrutiny/config:/opt/scrutiny/config
      - /mnt/appdata/scrutiny/influxdb:/opt/scrutiny/influxdb
      - /run/udev:/run/udev:ro
    env_file:
      - .env
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "1"
