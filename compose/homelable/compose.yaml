x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "1"

services:
  backend:
    image: ghcr.io/pouzor/homelable-backend:3.7.1@sha256:f0f5f26461991bb8c14bd835f06244755fed9e63f818fa184b237f2d55f7f188
    restart: unless-stopped
    mem_limit: 384m
    logging: *logging
    env_file:
      - .env
    environment:
      SQLITE_PATH: /app/data/homelab.db
    volumes:
      - /mnt/appdata/homelable/data:/app/data
    cap_add:
      - NET_RAW
    networks:
      - homelable

  frontend:
    image: ghcr.io/pouzor/homelable-frontend:3.7.1@sha256:2e52e1ba1cd0142c03988b247ca38f1fcbcf668efe39fb5849d432298a56a518
    restart: unless-stopped
    mem_limit: 64m
    logging: *logging
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/homelable.conf.template:ro
    ports:
      - "127.0.0.1:3333:80"
    depends_on:
      - backend
    networks:
      - homelable

networks:
  homelable:
    driver: bridge
