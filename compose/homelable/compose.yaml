x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "1"

services:
  backend:
    image: ghcr.io/pouzor/homelable-backend:3.8.0@sha256:f4f8b8061af27084c793803614e0009f3440fbbf7cc12033438868a86452d60a
    restart: unless-stopped
    mem_limit: 384m
    logging: *logging
    env_file:
      - .env
    environment:
      SQLITE_PATH: /app/data/homelab.db
    volumes:
      - /mnt/appdata/homelable/data:/app/data
    cap_add:
      - NET_RAW
    networks:
      - homelable

  frontend:
    image: ghcr.io/pouzor/homelable-frontend:3.8.0@sha256:629a18054f13b54e9c6dfbab059aca27bbf4bcc083a8366d43706d59aa5c6520
    restart: unless-stopped
    mem_limit: 64m
    logging: *logging
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/homelable.conf.template:ro
    ports:
      - "127.0.0.1:3333:80"
    depends_on:
      - backend
    networks:
      - homelable

networks:
  homelable:
    driver: bridge
