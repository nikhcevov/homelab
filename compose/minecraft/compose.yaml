# Fabric server with the Packwiz pack. 24454/udp is Simple Voice Chat,
# 8100/tcp is the map renderer.
services:
  minecraft-mc:
    container_name: minecraft-mc
    image: itzg/minecraft-server:java25@sha256:4f855c470f6bea196971e6031311130b23d8976258ad5db7e024d568fbda79f1
    restart: unless-stopped
    mem_limit: 7g
    stop_grace_period: 60s
    env_file:
      - .env
    # Inherited DNS returns FORMERR for Packwiz bootstrap's EDNS queries.
    dns:
      - 1.1.1.1
      - 1.0.0.1
    # Keep canonical HTTPS/SNI while reaching local Caddy before edge cutover.
    # Caddy must be serving the restored pack before this stack starts.
    extra_hosts:
      - "${PACKWIZ_HOST:?PACKWIZ_HOST must name the canonical pack server}:host-gateway"
    ports:
      - "25565:25565/tcp"
      - "25565:25565/udp"
      - "24454:24454/udp"
      - "8100:8100/tcp"
    volumes:
      - /mnt/appdata/minecraft/mc:/data
      - /mnt/appdata/minecraft/mc/downloads:/downloads
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "1"
