# Caddy with the Cloudflare DNS module. Host networking is required, not a
# preference: every upstream in the Caddyfile is 127.0.0.1:<port>, which only
# reaches the other stacks inside the host network namespace. A bridge would
# need host.docker.internal or a shared Docker network for every stack.
# The admin API stays on localhost:2019 and is not exposed.
services:
  caddy-cloudflare:
    container_name: caddy-cloudflare
    image: caddybuilds/caddy-cloudflare:2.11.9@sha256:17505a5e55432764957953787b065f400a1f1a0c280c3b4da2c99ce4746708d6
    restart: unless-stopped
    mem_limit: 128m
    network_mode: host
    env_file:
      - .env
    volumes:
      - /mnt/appdata/caddy/Caddyfile:/etc/caddy/Caddyfile:rw
      - /mnt/appdata/caddy/data:/data:rw
      - /mnt/appdata/caddy/config:/config:rw
      # The router's resolver returns FORMERR for ACME DNS-01 zone discovery.
      # This resolver is for Caddy's outbound ACME/Cloudflare lookups only.
      - ./resolv.conf:/etc/resolv.conf:ro
      - /mnt/appdata/obsidian/blog/public:/srv/obsidian:rw
      - /mnt/appdata/minecraft/mc/client_pack:/srv/pack/mc:rw
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "1"
