---
# Unraid (great-hornbill): deploy User Scripts entries onto the flash
# drive (/boot/config/plugins/user.scripts/scripts/<name>/{script,description}).
# Unraid has no python, so everything goes through raw + base64;
# idempotency is tracked via a .b64 marker next to the deployed file.
# Scheduling is set outside this playbook (see README "Backups -> Unraid"):
#   mover (Settings->Scheduler)      weekly Sun 00:00 (drain cache first)
#   CA Appdata Backup (plugin GUI)   weekly Sun 04:00, incl. flash backup
#   homelab-backup-pull              daily  05:00 (User Scripts GUI)
#   restic-vault-backup              weekly Sun 06:00 (User Scripts GUI)
#   parity check (Settings->Scheduler) monthly 08:00
- name: Configure Unraid backup collector
  hosts: unraid
  gather_facts: false
  vars:
    unraid_scripts_dir: /boot/config/plugins/user.scripts/scripts
    unraid_scripts:
      - name: homelab-backup-pull
        description: Pull homelab backups over tailnet (rsync + sysupgrade -b)
        template: files/unraid/homelab-backup-pull.sh.j2
      - name: restic-vault-backup
        description: Weekly restic backup of photos+backup shares to the vault pool
        template: files/unraid/restic-vault-backup.sh.j2
    restic_version: "0.17.3"
  tasks:
    # The templates embed ntfy topics from the vault — keep task output
    # (and the base64 payload) out of the logs.
    - name: Deploy User Scripts entries (script + description)
      no_log: true
      ansible.builtin.raw: |
        set -e
        dir="{{ unraid_scripts_dir }}/{{ item.name }}"
        mkdir -p "$dir"
        if [ "$(cat "$dir/.b64" 2>/dev/null)" = "{{ _script_b64 }}" ]; then
          echo ok
        else
          echo "{{ _script_b64 }}" | base64 -d > "$dir/script.tmp"
          mv "$dir/script.tmp" "$dir/script"
          chmod 755 "$dir/script"
          echo "{{ _script_b64 }}" > "$dir/.b64"
          echo changed
        fi
        echo "{{ _desc_b64 }}" | base64 -d > "$dir/description"
      vars:
        _script_b64: "{{ lookup('ansible.builtin.template', item.template) | b64encode }}"
        _desc_b64: "{{ item.description | b64encode }}"
      loop: "{{ unraid_scripts }}"
      register: _deploy
      changed_when: "'changed' in _deploy.stdout"

    # /usr and /root on Unraid are ramdisks — the only persistent place for
    # a binary is the flash drive. /boot/extra is the conventional spot, but
    # /boot is vfat and mounted noexec on current Unraid, so the version
    # probe can't execute from there: a .restic-version marker tracks what
    # is stored, and the user script stages the binary into /usr/local/bin
    # (ramdisk) before running it.
    - name: Install restic binary (pinned, persisted on the flash drive)
      ansible.builtin.raw: |
        set -e
        bin=/boot/extra/restic
        marker=/boot/extra/.restic-version
        mkdir -p /boot/extra
        if [ -f "$bin" ] && [ "$(cat "$marker" 2>/dev/null)" = "{{ restic_version }}" ]; then
          echo ok
          exit 0
        fi
        base="https://github.com/restic/restic/releases/download/v{{ restic_version }}"
        tmp=$(mktemp -d)
        # Keep the original filename: sha256sum -c looks the file up by the
        # name recorded in SHA256SUMS.
        curl --fail -sL "$base/restic_{{ restic_version }}_linux_amd64.bz2" -o "$tmp/restic_{{ restic_version }}_linux_amd64.bz2"
        curl --fail -sL "$base/SHA256SUMS" -o "$tmp/SHA256SUMS"
        (cd "$tmp" && grep "restic_{{ restic_version }}_linux_amd64.bz2" SHA256SUMS | sha256sum -c - >/dev/null)
        bunzip2 -c "$tmp/restic_{{ restic_version }}_linux_amd64.bz2" > "$bin.tmp"
        mv "$bin.tmp" "$bin"
        echo "{{ restic_version }}" > "$marker"
        rm -rf "$tmp"
        echo changed
      register: _restic
      changed_when: "'changed' in _restic.stdout"

    # Repo password: root-only on the flash drive (survives reboots, picked
    # up by CA Appdata Backup if flash backup is enabled there). Master
    # copy lives in group_vars/all/vault.yml (vault_restic_password).
    - name: Deploy restic repository password (root-only, on flash)
      no_log: true
      ansible.builtin.raw: |
        set -e
        dir=/boot/config/restic
        mkdir -p "$dir"
        if [ "$(cat "$dir/.b64" 2>/dev/null)" = "{{ _pw_b64 }}" ]; then
          echo ok
        else
          echo "{{ _pw_b64 }}" | base64 -d > "$dir/password.tmp"
          chmod 600 "$dir/password.tmp"
          mv "$dir/password.tmp" "$dir/password"
          echo "{{ _pw_b64 }}" > "$dir/.b64"
          chmod 600 "$dir/.b64"
          echo changed
        fi
      vars:
        _pw_b64: "{{ vault_restic_password | b64encode }}"
      register: _pw
      changed_when: "'changed' in _pw.stdout"
