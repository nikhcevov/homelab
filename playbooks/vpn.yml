---
# Full deployment for the VPN VPS, in layer order:
# bootstrap -> security -> network -> vpn (x-ui) -> proxy (caddy) -> backup -> monitoring.
# No Docker; VPN traffic is independent of the home lab.
# Tailscale provides management access and backup collection.
- name: Bootstrap base system
  hosts: vpn
  become: true
  roles:
    - debian_common
    - ssh

- name: Configure firewall and intrusion prevention
  hosts: vpn
  become: true
  roles:
    - ufw
    - fail2ban

- name: Configure tailnet connectivity
  hosts: vpn
  become: true
  roles:
    - tailscale

- name: Install 3x-ui VPN panel (native)
  hosts: vpn
  become: true
  roles:
    - xui

- name: Configure Caddy reverse proxy
  hosts: vpn
  become: true
  roles:
    - caddy

- name: Configure backups
  hosts: vpn
  become: true
  roles:
    - vpn_backup

- name: Configure monitoring
  hosts: vpn
  become: true
  roles:
    - monitoring

# Restore only when explicitly selected with --tags restore.
# On a fresh VPS, run the normal setup above first, then:
#   ansible-playbook playbooks/vpn.yml --tags restore -e vpn_restore_archive=/path/to/vpn-backup-YYYYMMDD-HHMMSS.tar.gz
#
# The archive is the authoritative source for the 3x-ui database
# (clients, UUIDs, Reality keys, subscriptions). Nothing is
# regenerated or rewritten.
- name: Restore VPN configuration from backup
  hosts: vpn
  become: true
  tags: [never, restore]
  vars:
    vpn_restore_archive: ""
  pre_tasks:
    - name: Check backup archive path is provided
      ansible.builtin.assert:
        that: vpn_restore_archive | length > 0
        fail_msg: "pass -e vpn_restore_archive=/path/to/vpn-backup-*.tar.gz"

    - name: Check backup archive exists locally
      ansible.builtin.stat:
        path: "{{ vpn_restore_archive }}"
      register: _restore_archive
      delegate_to: localhost
      become: false

    - name: Check backup archive is a file
      ansible.builtin.assert:
        that: _restore_archive.stat.exists
        fail_msg: "archive not found on the control machine: {{ vpn_restore_archive }}"

  tasks:
    - name: Upload backup archive
      ansible.builtin.copy:
        src: "{{ vpn_restore_archive }}"
        dest: /tmp/vpn-restore.tar.gz
        mode: "0600"

    - name: Stop services before restore
      ansible.builtin.service:
        name: "{{ item }}"
        state: stopped
      loop:
        - x-ui
        - caddy

    - name: Extract backup into place
      ansible.builtin.unarchive:
        src: /tmp/vpn-restore.tar.gz
        dest: /
        remote_src: true

    - name: Fix 3x-ui database permissions
      ansible.builtin.file:
        path: /etc/x-ui/x-ui.db
        owner: root
        group: root
        mode: "0600"

    - name: Fix Caddy data permissions
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: caddy
        group: caddy
        recurse: "{{ item.recurse }}"
      loop:
        - { path: /etc/caddy, recurse: false }
        - { path: /var/lib/caddy, recurse: true }

    - name: Start services after restore
      ansible.builtin.service:
        name: "{{ item }}"
        state: started
        enabled: true
      loop:
        - x-ui
        - caddy

    - name: Remove uploaded archive
      ansible.builtin.file:
        path: /tmp/vpn-restore.tar.gz
        state: absent
