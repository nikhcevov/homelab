---
# Layer 2 — security: UFW firewall and fail2ban.
- name: Configure firewall and intrusion prevention
  hosts: vps
  become: true
  pre_tasks:
    - name: Load proxy services for firewall listeners
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../vars/proxy.yml"
      when: ufw_open_service_ports | bool
  roles:
    - role: ufw
      vars:
        ufw_proxy_services: "{{ services }}"
    - fail2ban
