---
# Edge setup and updates: reconcile all stages in order, or select stage tags.
# Separate plays preserve each stage's handler flush boundaries.
- name: Bootstrap base system
  hosts: edge_nodes
  become: true
  tags: [bootstrap]
  pre_tasks:
    - name: Reconcile edge OS hostname
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"
  roles:
    - debian_common
    - ssh

- name: Configure firewall and intrusion prevention
  hosts: edge_nodes
  become: true
  tags: [security]
  pre_tasks:
    - name: Load proxy services for firewall listeners
      ansible.builtin.include_vars:
        file: "{{ proxy_vars_file | default(playbook_dir ~ '/../vars/proxy.yml') }}"
      when: ufw_open_service_ports | bool
  roles:
    - role: ufw
      vars:
        ufw_proxy_services: "{{ services }}"
    - fail2ban

- name: Configure tailnet connectivity
  hosts: edge_nodes
  become: true
  tags: [network]
  roles:
    - tailscale

- name: Configure stream reverse proxy
  hosts: edge_nodes
  become: true
  tags: [proxy]
  pre_tasks:
    - name: Load proxy services for nginx
      ansible.builtin.include_vars:
        file: "{{ proxy_vars_file | default(playbook_dir ~ '/../vars/proxy.yml') }}"
  roles:
    - nginx

- name: Configure additional services
  hosts: edge_nodes
  become: true
  tags: [services]
  roles:
    - monitoring
