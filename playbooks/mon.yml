---
# Full deployment for the central monitoring VPS, in layer order:
# bootstrap -> security -> network -> gatus -> proxy (caddy) -> self-monitoring.
# External black-box watcher (Gatus) for the whole fleet;
# local cron checks cover this host's own internals.
- name: Bootstrap base system
  hosts: mon
  become: true
  roles:
    - debian_common
    - ssh

- name: Configure firewall and intrusion prevention
  hosts: mon
  become: true
  roles:
    - ufw
    - fail2ban

- name: Configure tailnet connectivity
  hosts: mon
  become: true
  roles:
    - tailscale

- name: Install Gatus
  hosts: mon
  become: true
  tags: [gatus]
  roles:
    - gatus

- name: Configure Caddy reverse proxy
  hosts: mon
  become: true
  tags: [caddy]
  roles:
    - caddy

- name: Configure monitoring
  hosts: mon
  become: true
  tags: [monitoring]
  roles:
    - monitoring
