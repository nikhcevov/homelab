---
# Full edge VPS deployment: run every layer in order on the vps group only.
# For partial runs use the per-layer playbooks instead:
#   playbooks/bootstrap.yml -> playbooks/security.yml -> playbooks/network.yml -> playbooks/proxy.yml -> playbooks/services.yml
- ansible.builtin.import_playbook: bootstrap.yml
- ansible.builtin.import_playbook: security.yml
- ansible.builtin.import_playbook: network.yml
- ansible.builtin.import_playbook: proxy.yml
- ansible.builtin.import_playbook: services.yml
