---
# Full deployment for the central monitoring VPS, in layer order:
# bootstrap -> security -> kuma -> proxy (caddy) -> backup -> self-monitoring.
# External black-box watcher (Uptime Kuma) for the whole fleet;
# local cron checks cover this host's own internals.
- name: Bootstrap base system
  hosts: mon
  become: true
  roles:
    - common
    - ssh

- name: Configure firewall and intrusion prevention
  hosts: mon
  become: true
  roles:
    - ufw
    - fail2ban

- name: Install Uptime Kuma (native)
  hosts: mon
  become: true
  roles:
    - kuma

- name: Configure Caddy reverse proxy
  hosts: mon
  become: true
  roles:
    - caddy

- name: Configure backups
  hosts: mon
  become: true
  roles:
    - kuma_backup

- name: Configure monitoring
  hosts: mon
  become: true
  roles:
    - monitoring
