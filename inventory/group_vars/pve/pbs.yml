---
# Existing CT101 backup/restore gates passed; reconcile it and its schedules.
pve_pbs_enabled: true
# Native recovery and timezone/catch-up checks passed before activation.
pve_pbs_schedules_enabled: true
pve_pbs_id: 101
pve_pbs_hostname: pbs
pve_pbs_memory: 5120
pve_pbs_cores: 2
pve_pbs_root_storage: local-zfs
pve_pbs_root_size: 16
pve_pbs_template_storage: local
pve_pbs_dataset: tank/pbs
pve_pbs_host_path: /tank/pbs
pve_pbs_datastore_path: /mnt/datastore/tank
pve_pbs_datastore: tank
pve_pbs_lan_bridge: vmbr0
pve_pbs_private_bridge: vmbr1
pve_pbs_address: 10.77.0.3
pve_pbs_host_address: 10.77.0.1
pve_pbs_storage_id: pbs-tank
pve_pbs_user: pve@pbs
pve_pbs_token: pve
# Host-only recovery secret, also collect in the host recovery backup.
pve_pbs_secret_path: /root/.config/homelab/pbs-token.json
pve_pbs_backup_vm: 100
# PVE and PBS schedules use bootstrap_timezone (Asia/Yerevan, UTC+04).
# Leave the measured ~3h restic window from03:00 clear of PBS maintenance.
pve_pbs_backup_schedule: '02:00'
pve_pbs_verify_schedule: 'sun 10:00'
pve_pbs_prune_schedule: '07:00'
pve_pbs_gc_schedule: '08:00'
pve_pbs_keep_daily: 7
pve_pbs_keep_weekly: 4
pve_pbs_keep_monthly: 6
