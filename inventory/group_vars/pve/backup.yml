---
# Apply only after the managed VM data cutover and protected collector migration.
# Native VM backups keep their separate02:00 schedule; filesystem collection is
# after the latest06:30 upstream generation, explicitly in Asia/Yerevan.
pve_backup_enabled: true
pve_backup_calendar: '*-*-* 07:15:00'
pve_backup_collector: /rpool/backup-staging/collector
pve_backup_collector_dataset: rpool/backup-staging/collector
# Review pins out-of-band before enabling a one-time bootstrap; never overwrite
# existing source pins or replace the preserved private collector identity.
pve_backup_bootstrap_known_hosts: false
pve_backup_ssh_private_key: "{{ vault_pve_backup_ssh_private_key }}"
pve_backup_known_hosts: "{{ vault_pve_backup_known_hosts }}"
