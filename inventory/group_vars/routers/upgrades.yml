---
# Update checks (role: openwrt_upgrades). Notify-only via ntfy: nothing
# is installed automatically. Apply with
#   ansible-playbook playbooks/openwrt.yml --tags upgrade
# (image-based via owut; --tags fw_upgrade is an alias).

# Master switch; false removes the role from the play.
owrt_update_check: true

# Cron schedule (BusyBox crond reads /etc/crontabs/root).
owrt_update_check_schedule: "0 10 * * *"

# Firmware check via owut (ASU). The owut package is installed when true.
owrt_owut_check: true
