---
# Tailscale mesh VPN (role: openwrt_tailscale).
# Variable names intentionally match the Debian tailscale role.

# Hostname shown in the tailnet (defaults to the inventory name).
tailscale_hostname: "{{ inventory_hostname }}"

# Auth key from the shared vault (inventory/group_vars/all/vault.yml).
# Absent = day-0 manual join (the default flow).
tailscale_auth_key: "{{ vault_tailscale_auth_key | default('') }}"

# Optional: advertise the LAN subnet as an exit of site-to-site routing.
# Example: "192.168.1.0/24" (must match owrt_lan_*). Empty = disabled.
tailscale_advertise_routes: ""

# Advertise this router as an exit node (full-tunnel internet access via
# this WAN). IP forwarding is already on (openwrt_common sysctl); the
# firewall role adds tailscale -> wan forwarding when this is true.
# Enable per-host in inventory/host_vars/router-*.yml. After the first run, approve
# the exit route in the Tailscale admin console (Machines -> node -> Edit
# route settings) — or add autoApprovers.exitNode to the tailnet ACLs.
tailscale_advertise_exit_node: false

# Client side: route this router (and its LAN clients, see the firewall
# role) through another tailnet exit node. Value: tailnet hostname or IP
# of the exit node. Empty = direct internet via WAN (default).
# For an exit-node gateway VM: set this, leave advertise_* off.
tailscale_exit_node: ""

# Allow this device itself to keep talking to its local LAN while an exit
# node is selected. tailscaled reacts by keeping `throw` routes for the
# directly connected subnets in table 52; since the exit-node rule is
# `from all lookup 52`, that also keeps *forwarded* LAN traffic to those
# subnets off the tunnel (router-trvl relies on this for its WAN-side
# local server).
tailscale_exit_node_allow_lan_access: false

# Tailscale SSH: tailscaled terminates port 22 on the tailnet in userspace,
# so management survives a broken tailscale0, kernel policy rules or fw4 —
# the failure mode that locked router-krm out on 2026-11-06.
# Requires an `ssh` rule in files/tailscale/policy.json (dst cannot be a
# bare wildcard there); without a matching rule every connection is denied.
# Enabling it stops key-based dropbear from serving the tailnet and changes
# the node's SSH host key, so roll it out one router at a time with
# `-e owrt_update_check=false` (anything after the tailscale role would hit
# the new host key), then clear the stale entry:
#   ssh-keygen -R <tailscale-hostname>.<tailnet_domain>
# Local LAN SSH still goes to dropbear.
tailscale_ssh: false
