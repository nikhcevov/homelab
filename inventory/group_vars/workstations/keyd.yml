---
# keyd: Caps Lock = Left Ctrl, Left Ctrl = Hyper (Ctrl+Alt+Shift+Super)
# on every keyboard except the IDs below (role: keyd, config:
# /etc/keyd/default.conf).
#
# Exclusions are device-based, not host-based: listed keyboards pass
# through unchanged wherever they are connected. With an empty list,
# generic USB keyboards and built-in keyboards all get the remap.
#
# Find a keyboard's ID on the machine: `sudo keyd monitor` prints one
# vendor:product id per grabbed device while you type.
keyd_excluded_ids: []
# Example:
# keyd_excluded_ids:
#   - "046d:c52b"
