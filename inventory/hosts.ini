[vps]
edge ansible_host="{{ vault_vps_ip }}" ansible_user=root

[vpn]
vpn-1 ansible_host="{{ vault_vpn_ip }}" ansible_user=root

[mon]
mon-1 ansible_host="{{ vault_mon_ip }}" ansible_user=root

[routers]
router-alm ansible_host="{{ vault_router_alm_ip }}" ansible_user=root
router-krm ansible_host="{{ vault_router_krm_ip }}" ansible_user=root

[vps:vars]
ansible_python_interpreter=/usr/bin/python3

[vpn:vars]
ansible_python_interpreter=/usr/bin/python3

[mon:vars]
ansible_python_interpreter=/usr/bin/python3

[routers:vars]
ansible_python_interpreter=/usr/bin/python3
