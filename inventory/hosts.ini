[vps]
edge ansible_host="{{ vault_vps_ip }}" ansible_user=root

[vpn]
# One line per VPN server; per-host IP/domains/secrets: host_vars/vpn-<cc>.yml
vpn-nl ansible_host="{{ vault_vpn_ip }}" ansible_user=root

[mon]
mon-1 ansible_host="{{ vault_mon_ip }}" ansible_user=root

[unraid]
# great-hornbill: Unraid, central backup collector (pull model). Managed
# via raw-only tasks in unraid.yml — Unraid has no python for modules.
great-hornbill ansible_host=100.67.32.47 ansible_user=root

[routers]
# Fresh OpenWrt flash answers at 192.168.1.1; only one fresh device can
# hold that address at a time. After the first run switch to the new LAN
# IP (host_vars/) or the tailnet name.
router-alm ansible_host=192.168.101.1 ansible_user=root
# router-krm ansible_host=192.168.1.1 ansible_user=root

[vps:vars]
ansible_python_interpreter=/usr/bin/python3

[vpn:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_private_key_file=~/.ssh/starling

[mon:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_private_key_file=~/.ssh/starling

[unraid:vars]
ansible_ssh_private_key_file=~/.ssh/starling

[routers:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_private_key_file=~/.ssh/starling
# Dropbear has no sftp/scp server; skip the failing transfer probes.
ansible_ssh_transfer_method=piped
