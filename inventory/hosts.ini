# Management plane = the tailnet only. Every ansible_host is a MagicDNS
# name: <tailscale-hostname>.{{ tailnet_domain }} (domain set once in
# inventory/group_vars/all/tailscale.yml, hostnames in inventory/group_vars/*/tailscale.yml).
# Day-0 on a fresh router is the exception: OS + hostname + LAN IP + SSH
# key are manual, then the FIRST playbooks/openwrt.yml run goes over the LAN
# (ansible_host=<lan-ip>); once tailscale is up, switch the line to the
# MagicDNS form. See docs/openwrt.md.

[edge]
# tailscale_hostname: edge-proxy (inventory/group_vars/edge/tailscale.yml) —
# inventory name intentionally matches the tailnet name.
edge-proxy ansible_host="edge-proxy.{{ tailnet_domain }}" ansible_user=root

[vpn]
# One line per VPN server; per-host domains/secrets: inventory/host_vars/vpn-<cc>.yml
vpn-nl ansible_host="vpn-nl.{{ tailnet_domain }}" ansible_user=root

[mon]
mon-1 ansible_host="mon-1.{{ tailnet_domain }}" ansible_user=root

[unraid]
# great-hornbill: Unraid, central backup collector (pull model). Managed
# via raw-only tasks in playbooks/unraid.yml — Unraid has no python for modules.
great-hornbill ansible_host="great-hornbill.{{ tailnet_domain }}" ansible_user=root

[routers]
router-srt ansible_host="router-srt.{{ tailnet_domain }}" ansible_user=root
# router-alm: reserve SD card with day-0 setup, LAN 192.168.101.1,
# for use if router-srt's SD card fails. Not an active managed host;
# bootstrapping is still required. See docs/openwrt.md#reserve-sd-card.
# router-alm ansible_host="router-alm.{{ tailnet_domain }}" ansible_user=root
router-krm ansible_host="router-krm.{{ tailnet_domain }}" ansible_user=root
router-trvl ansible_host="router-trvl.{{ tailnet_domain }}" ansible_user=root

[edge:vars]
ansible_python_interpreter=/usr/bin/python3

[vpn:vars]
ansible_python_interpreter=/usr/bin/python3

[mon:vars]
ansible_python_interpreter=/usr/bin/python3

[unraid:vars]

[routers:vars]
ansible_python_interpreter=/usr/bin/python3
# Dropbear has no sftp/scp server; skip the failing transfer probes.
ansible_ssh_transfer_method=piped

[workstations]
# Arch/CachyOS desktops (playbook: playbooks/workstation.yml). starling hosts this
# repo — day-0 there is `ansible-playbook playbooks/workstation.yml -c local
# --limit starling --ask-become-pass` (sshd + MagicDNS come from the
# arch_common/ssh roles), afterwards it's tailnet-managed like the rest.
starling ansible_host="starling.{{ tailnet_domain }}" ansible_user=boss
blue-tit ansible_host="blue-tit.{{ tailnet_domain }}" ansible_user=boss
little-raven ansible_host="little-raven.{{ tailnet_domain }}" ansible_user=boss

[workstations:vars]
ansible_python_interpreter=/usr/bin/python3
