# Management plane = the tailnet only. Every ansible_host is a MagicDNS
# name: <tailscale-hostname>.{{ tailnet_domain }} (domain set once in
# inventory/group_vars/all/tailscale.yml, hostnames in inventory/group_vars/*/tailscale.yml).
# Day-0 router/PVE/VM bootstrap temporarily uses a LAN ansible_host override:
# OS, hostname, stable host address and the first controller SSH key are manual.
# After Tailscale joins, use the MagicDNS inventory name. See docs/openwrt.md,
# docs/pve-host.md and docs/docker-stacks.md for the distinct bootstrap gates.

[edge_nodes]
# tailscale_hostname follows inventory_hostname (inventory/group_vars/edge_nodes/tailscale.yml).
# Desired identity; complete the console cutover in docs/edge.md before deployment.
edge ansible_host="edge.{{ tailnet_domain }}" ansible_user=root

[vpn]
# One line per VPN server; per-host domains/secrets: inventory/host_vars/vpn-<cc>.yml
vpn-nl ansible_host="vpn-nl.{{ tailnet_domain }}" ansible_user=root

[mon]
mon-1 ansible_host="mon-1.{{ tailnet_domain }}" ansible_user=root

[routers]
router-srt ansible_host="router-srt.{{ tailnet_domain }}" ansible_user=root
# router-alm: reserve SD card with day-0 setup, LAN 192.168.101.1,
# for use if router-srt's SD card fails. Not an active managed host;
# bootstrapping is still required. See docs/openwrt.md#reserve-sd-card.
# router-alm ansible_host="router-alm.{{ tailnet_domain }}" ansible_user=root
router-krm ansible_host="router-krm.{{ tailnet_domain }}" ansible_user=root
# router-evn: home router at the great-hornbill site (ex-router-trvl, reset
# 2026-11-15). LAN 192.168.102.0/24; day-0 in docs/openwrt.md#home-router-router-evn.
router-evn ansible_host="router-evn.{{ tailnet_domain }}" ansible_user=root
# router-gw: x86-64 OpenWrt VM (VMID 102 on great-hornbill). Its only LAN
# client is the work laptop on a dedicated NIC; a full-tunnel exit-node
# client, not a site router. Day-0 in docs/openwrt.md#gateway-vm-router-gw.
router-gw ansible_host="router-gw.{{ tailnet_domain }}" ansible_user=root

[edge_nodes:vars]
ansible_python_interpreter=/usr/bin/python3

[vpn:vars]
ansible_python_interpreter=/usr/bin/python3

[mon:vars]
ansible_python_interpreter=/usr/bin/python3

[routers:vars]
ansible_python_interpreter=/usr/bin/python3
# Dropbear has no sftp/scp server; skip the failing transfer probes.
ansible_ssh_transfer_method=piped

[pve]
# Installed PVE host; use a LAN override until its new tailnet identity is verified.
great-hornbill ansible_host="great-hornbill.{{ tailnet_domain }}" ansible_user=root

[pve:vars]
ansible_python_interpreter=/usr/bin/python3

[docker]
# VM100 is booted and guest-baseline configuration is approved.
# Use the verified LAN override until this guest joins its tailnet identity.
docker-1 ansible_host="docker-1.{{ tailnet_domain }}" ansible_user=boss

[docker:vars]
ansible_python_interpreter=/usr/bin/python3

[workstations]
# Arch/CachyOS desktops (playbook: playbooks/workstation.yml). little-raven (laptop)
# hosts this repo — day-0 there is `ansible-playbook playbooks/workstation.yml
# -c local --limit little-raven --ask-become-pass` (sshd + MagicDNS come from the
# arch_common/ssh roles), afterwards it's tailnet-managed like the rest.
# Fresh remote workstation day-0 (docs/workstations.md): user `boss` with sudo,
# `openssh python tailscale`, the controller's key in ~/.ssh/authorized_keys, then
#   ansible-playbook playbooks/workstation.yml --limit <host> --ask-become-pass
# From a managed controller the MagicDNS name resolves immediately; the fresh host
# resolves tailnet names itself only after arch_common rewires NetworkManager to
# systemd-resolved, so -e ansible_host=<tailscale-ip> is only for a run started ON
# that host (e.g. a `-c local` day-0).
starling ansible_host="starling.{{ tailnet_domain }}" ansible_user=boss
little-raven ansible_host="little-raven.{{ tailnet_domain }}" ansible_user=boss

[workstations:vars]
ansible_python_interpreter=/usr/bin/python3
