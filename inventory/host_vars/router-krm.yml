---
# router-krm — per-host overrides. Shared defaults: inventory/group_vars/routers/.
# Anything defined here wins over group_vars.

# --- Identity ---
# Hostname on the device and in the tailnet (default: inventory name).
# owrt_hostname: router-krm
# tailscale_hostname: router-krm

# --- Network ---
# LAN IP of this router (used by /etc/config/network).
owrt_lan_ip: 192.168.100.1
# Non-default LAN size:
# owrt_lan_netmask: "255.255.255.0"
# Different hardware -> different DSA port names (`ip link` on the router):
# owrt_lan_bridge_ports:
#   - lan1
#   - lan2
#   - lan3
#   - lan4

# ISP binds the WAN lease to this MAC — without it the WAN stays down.
owrt_wan_mac: "50:ff:20:73:35:fd"

# Static leases migrated from the manual config; devices keep their IPs
# after the repo takes over /etc/config/dhcp.
owrt_dhcp_hosts:
  - { name: ha-krm, ip: 192.168.100.30, mac: "dc:a6:32:9a:cb:1f" }
  - { name: nvr, ip: 192.168.100.40, mac: "24:28:fd:3e:1e:f5" }

# --- Location ---
owrt_timezone_name: Europe/Moscow

# --- DNS ---
# Search domain for this site:
owrt_dns_domain: krm.home.arpa

# --- Wi-Fi ---
# Mirrors the live config as of onboarding (WR3000S, MT7981 paths).
# 802.11r (fast roaming between the radios) stays on; PSK from the vault.
# sae-mixed: WPA3 for capable clients, WPA2 fallback for the rest —
# same PSK, no client reconfiguration needed.
owrt_wireless_country: RU
owrt_wireless_radios:
  - name: radio0
    path: platform/soc/18000000.wifi # 2.4 GHz
    band: 2g
    channel: "6"
    htmode: HE20
    options:
      cell_density: 0
    ifaces:
      - name: default_radio0
        ssid: KR_102
        encryption: sae-mixed
        key: "{{ vault_wireless_psk_krm }}"
        options:
          multicast_to_unicast_all: 1
          ieee80211r: 1
          ft_over_ds: 0
          ft_psk_generate_local: 1
          # Quarantine the compromised kitchen camera (see Firewall below).
          # It joins as a Wi-Fi client, and bridged LAN-to-LAN traffic does
          # not pass the IP forward rules, so the effective cut is here.
          # Deny on both radios: the station may roam to 5 GHz.
          macfilter: deny
          maclist:
            - "14:a7:8b:5c:2e:de"
  - name: radio1
    path: platform/soc/18000000.wifi+1 # 5 GHz
    band: 5g
    channel: "36"
    htmode: HE80
    options:
      cell_density: 0
    ifaces:
      - name: default_radio1
        ssid: KR_102
        encryption: sae-mixed
        key: "{{ vault_wireless_psk_krm }}"
        options:
          multicast_to_unicast_all: 1
          ieee80211r: 1
          ft_over_ds: 0
          ft_psk_generate_local: 1
          # Quarantine the compromised kitchen camera (see Firewall below).
          # It joins as a Wi-Fi client, and bridged LAN-to-LAN traffic does
          # not pass the IP forward rules, so the effective cut is here.
          # Deny on both radios: the station may roam to 5 GHz.
          macfilter: deny
          maclist:
            - "14:a7:8b:5c:2e:de"

# --- Tailscale ---
# Advertise this site's LAN to the tailnet (matches owrt_lan_*).
tailscale_advertise_routes: "192.168.100.0/24"
# Exit node: full-tunnel internet via this WAN. Approved once in the
# Tailscale admin console (Edit route settings), or autoApprovers.exitNode.
tailscale_advertise_exit_node: true
# Remote recovery: tailscaled serves port 22 on the tailnet itself, so
# management survives a broken tailscale0 or firewall. Enabled 2026-11-08
# with a one-shot rollback timer armed (marker file) and verified before
# it expired.
tailscale_ssh: true

# --- Firewall ---
# MT7981 WED: NAT/forwarding bypasses the CPU. Incompatible with SQM and
# per-flow netfilter rules (offloaded flows skip them) — we have neither.
owrt_flow_offloading_hw: true

# Quarantine for the kitchen camera (Dahua OEM, 2018 firmware, found
# compromised 2026-11-08: forged OSD text, attacker-created reserved admin
# accounts, and an active Dahua cloud/P2P tunnel). The effective cut is the
# Wi-Fi MAC deny above: the camera is a bridged Wi-Fi client, so LAN-to-LAN
# frames never reach the IP forward rules. These rules block routed egress
# if it ever reappears on a wired/uplink path. Remove only after the camera
# is factory-reset (needs physical access) or replaced.
owrt_firewall_rules:
  - name: Block-Kitchen-Cam-WAN
    src: lan
    dest: wan
    proto: all
    src_ip: 192.168.100.164
    target: REJECT
  - name: Block-Kitchen-Cam-Tailscale
    src: lan
    dest: tailscale
    proto: all
    src_ip: 192.168.100.164
    target: REJECT
