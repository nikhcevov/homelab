---
# router-trvl — Cudy TR3000 v1 (MT7981, 256 MB), travel router.
# Per-host overrides. Shared defaults: inventory/group_vars/routers/.
# Anything defined here wins over group_vars.

# --- Identity ---
# Hostname on the device and in the tailnet (default: inventory name).
# owrt_hostname: router-trvl
# tailscale_hostname: router-trvl

# --- Network ---
# LAN IP of this router (used by /etc/config/network).
owrt_lan_ip: 192.168.102.1
# TR3000 has no DSA switch: two standalone GMACs — eth0 = 2.5G WAN,
# eth1 = 1G LAN (same layout as router-srt). Per OpenWrt board.d:
# cudy,tr3000-256mb-v1 -> ucidef_set_interfaces_lan_wan eth1 eth0.
owrt_lan_bridge_ports:
  - eth1
owrt_wan_device: eth0

# --- Location ---
owrt_timezone_name: Europe/Moscow

tailscale_ssh: true

# --- DNS ---
# Search domain for this site:
owrt_dns_domain: trvl.home.arpa
# Resolve through router-srt's dnsmasq over the tailnet, not locally:
# answers (CDN localization, resolver egress) must look like they come
# from the srt site, same as the MacBook's exit-node traffic. Cost: all
# DNS on this LAN depends on the tailnet + router-srt being up.
owrt_dns_servers:
  - 100.77.53.118 # router-srt

# Local service on the uplink segment (Unraid, 192.168.15.0/24 behind the
# home ISP router). Answered by this router's dnsmasq before the
# forward-to-srt lookup, so the name works while the tunnel is up but
# without sending the query to srt. `config domain` also matches every
# subdomain of the name.
owrt_dns_records:
  - name: llm.home.arpa
    ip: 192.168.15.36

# --- Wi-Fi ---
# MT7981 DBDC paths; verify against the stock config on the device:
#   cat /etc/config/wireless
# PSK comes from the vault: add it once with
#   ansible-vault encrypt_string '<psk>' --name vault_wireless_psk
# and append to inventory/group_vars/all/vault.yml.
# owrt_wireless_country: RU   # regulatory domain (channels/DFS)
owrt_wireless_radios:
  - name: radio0
    path: platform/soc/18000000.wifi # 2.4 GHz
    band: 2g
    channel: auto
    htmode: HE20
    ifaces:
      - ssid: trvl
        encryption: sae-mixed
        key: "{{ vault_wireless_psk }}"
  - name: radio1
    path: platform/soc/18000000.wifi+1 # 5 GHz
    band: 5g
    channel: auto
    htmode: HE80
    ifaces:
      - ssid: trvl
        encryption: sae-mixed
        key: "{{ vault_wireless_psk }}"

# --- Firewall ---
# MT7981 WED: NAT/forwarding bypasses the CPU. Incompatible with SQM and
# per-flow netfilter rules (offloaded flows skip them). No SQM here; the
# only per-flow rule is Allow-LiteLLM below. A rule is still evaluated for
# the first packet of a flow (offload happens after the accept), so the
# exception holds — but an already-offloaded flow keeps its verdict, so
# counters undercount and a later rule change only affects new flows.
owrt_flow_offloading_hw: true

# The one lan -> wan exception: the local server lives on the uplink
# segment, so taking the exit node to reach it would hairpin through
# router-srt. Everything else still has no lan -> wan path (see the kill
# switch below). Generated nft rule:
#   ip saddr 192.168.102.0/24 ip daddr 192.168.15.36 tcp dport 80 accept
owrt_firewall_rules:
  - name: Allow-LiteLLM
    src: lan
    dest: wan
    proto: tcp
    dest_ip: 192.168.15.36
    dest_port: "80"
    target: ACCEPT
  # Containment: the blanket `lan -> tailscale` forwarding exists only for
  # the exit-node default route. Every direct lane into the tailnet is
  # rejected, so a client on this LAN cannot reach tailnet peers, and
  # cannot query router-srt's resolver directly to bypass this router's
  # DNS. Exit-node traffic is addressed to the public destination, so it
  # never matches these prefixes. `dest: tailscale` is required: without
  # it fw4 renders the rule into input_lan (traffic to the router) and it
  # filters nothing.
  - name: Block-LAN-To-Tailnet
    src: lan
    dest: tailscale
    proto: all
    dest_ip: 100.64.0.0/10
    target: REJECT
  - name: Block-LAN-To-Tailnet6
    src: lan
    dest: tailscale
    proto: all
    dest_ip: fd7a:115c:a1e0::/48
    family: ipv6
    target: REJECT

# --- Tailscale ---
# Advertise this site's LAN to the tailnet (matches owrt_lan_*).
tailscale_advertise_routes: "192.168.102.0/24"
# Exit node: full-tunnel internet via this WAN. Approved once in the
# Tailscale admin console (Edit route settings), or autoApprovers.exitNode.
# tailscale_advertise_exit_node: true

# --- Full-tunnel exit node: the whole LAN exits via router-srt ---
# tailscaled installs a blanket `5270: from all lookup 52` when an exit
# node is set — every LAN client rides the tunnel, no per-device policy
# routing needed (this router serves only the MacBook anyway).
tailscale_exit_node: router-srt
# Keeps throw routes for the local subnet in table 52, so LAN traffic
# is not eaten by the tunnel's default route.
tailscale_exit_node_allow_lan_access: true

# Kill switch: no lan -> wan forwarding at all. If tailscaled or the
# exit node dies, the LAN has no internet — never a silent WAN fallback.
# The single exception is the Allow-LiteLLM rule above: one host on the
# uplink segment, one port. The firewall role renders lan -> tailscale
# masquerade automatically when tailscale_exit_node is set.
owrt_firewall_lan_wan_forwarding: false

# The blanket 5270 rule also catches the router's OWN traffic (apk, NTP,
# ntfy). Pin the management plane to the direct WAN: it must not depend
# on the exit node being up (and downloads.openwrt.org/Fastly is blocked
# from the srt egress anyway). Only LAN client traffic is forced into
# the tunnel.
#
# netifd resolves `in`/`out` as UCI *interface* names, not device names:
# `in: lo` matches no interface and the rule is dropped without a log
# line (netifd 2026.x). The loopback section is `loopback`, whose device
# is `lo`.
owrt_network_rules:
  - comment: router -> tailnet peers (e.g. DNS via router-srt) stays in the tunnel
    priority: 5264
    in: loopback
    dest: "100.64.0.0/10"
    lookup: "52"
  - comment: router -> internet direct via WAN (management plane)
    priority: 5265
    in: loopback
    lookup: main
