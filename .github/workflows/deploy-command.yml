---
name: Deploy from issue comment

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: deploy-docker
  cancel-in-progress: false

jobs:
  parse:
    name: Parse deploy command
    if: ${{ github.event.issue.title == 'Container deployment pending' && github.event.comment.user.type != 'Bot' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      valid: ${{ steps.parse.outputs.valid }}
      stacks: ${{ steps.parse.outputs.stacks }}
      issue: ${{ steps.parse.outputs.issue }}
      reason: ${{ steps.parse.outputs.reason }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'

      - name: Install parser dependency
        run: python -m pip install pyyaml

      - name: Parse comment
        id: parse
        env:
          COMMENT: ${{ github.event.comment.body }}
          ISSUE: ${{ github.event.issue.number }}
          ASSOC: ${{ github.event.comment.author_association }}
          ACTOR: ${{ github.event.comment.user.login }}
        run: |
          python - <<'PY'
          import os
          import re
          import sys
          import yaml

          association = os.environ['ASSOC']
          actor = os.environ['ACTOR']
          issue = os.environ['ISSUE']
          comment = os.environ['COMMENT']
          if association not in {'OWNER', 'MEMBER', 'COLLABORATOR'} or actor.endswith('[bot]'):
              sys.exit(0)
          match = re.search(r'^\s*/deploy\s+(.+?)\s*$', comment, re.M)
          if not match:
              sys.exit(0)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f'issue={issue}\n')
          requested = [item for item in re.split(r'[,\s]+', match.group(1).strip()) if item]
          with open('inventory/group_vars/docker/compose.yml', encoding='utf-8') as handle:
              allowed = yaml.safe_load(handle)['compose_stacks']
          unknown = sorted(set(requested) - set(allowed))
          if not requested or unknown:
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
                  handle.write('valid=false\n')
                  handle.write(f'reason=Unknown or empty stacks: {", ".join(unknown or requested)}\n')
              sys.exit(0)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write('valid=true\n')
              handle.write(f'stacks={",".join(requested)}\n')
          PY

  deploy:
    name: Deploy requested stacks
    needs: parse
    if: ${{ needs.parse.outputs.valid == 'true' }}
    uses: ./.github/workflows/deploy-docker-reusable.yml
    with:
      stacks: ${{ needs.parse.outputs.stacks }}
      confirm_restore_gate: true
    secrets: inherit
    permissions:
      contents: read

  report:
    name: Report deploy result
    needs: [parse, deploy]
    if: ${{ always() && needs.parse.outputs.issue != '' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Comment on deploy issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ needs.parse.outputs.issue }}
          RESULT: ${{ needs.deploy.result }}
          STACKS: ${{ needs.parse.outputs.stacks }}
          REASON: ${{ needs.parse.outputs.reason }}
          ACTOR: ${{ github.event.comment.user.login }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "Deploy result: **${RESULT}**"
            echo
            echo "- Stacks: \`${STACKS:-none}\`"
            echo "- Requested by: @${ACTOR}"
            echo "- Run: ${RUN_URL}"
            if [ -n "${REASON}" ]; then
              echo "- Reason: ${REASON}"
            fi
          } > /tmp/deploy-result.md
          gh issue comment "$ISSUE" --body-file /tmp/deploy-result.md
