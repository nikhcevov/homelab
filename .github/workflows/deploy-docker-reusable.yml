---
name: Deploy containers (reusable)

on:
  workflow_call:
    inputs:
      stacks:
        description: Comma-separated stack names from compose_stacks
        required: true
        type: string
      confirm_restore_gate:
        description: Confirm compose_data_restored=true and the restore marker exists
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy selected Compose stacks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'

      - name: Require restore-gate confirmation
        if: ${{ !inputs.confirm_restore_gate }}
        run: |
          echo "Refusing deployment: confirm_restore_gate must be checked." >&2
          exit 1

      - name: Install pinned controller
        run: python -m pip install -r requirements-controller.txt

      - name: Install pinned collections
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ runner.temp }}/ansible-collections
        run: |
          ansible-galaxy collection install -r requirements.yml -p "$ANSIBLE_COLLECTIONS_PATH"

      - name: Validate stack selection
        id: validate
        env:
          REQUESTED_STACKS: ${{ inputs.stacks }}
        run: |
          python - <<'PY'
          import json
          import os
          import yaml

          with open('inventory/group_vars/docker/compose.yml', encoding='utf-8') as handle:
              allowed = yaml.safe_load(handle)['compose_stacks']
          requested = [item.strip() for item in os.environ['REQUESTED_STACKS'].split(',') if item.strip()]
          unknown = sorted(set(requested) - set(allowed))
          if not requested or unknown:
              raise SystemExit(f'Refusing unknown or empty stacks: {unknown or requested}')
          with open('extra_vars.json', 'w', encoding='utf-8') as handle:
              json.dump({'compose_stacks': requested, 'compose_data_restored': True}, handle)
          print('Selected stacks:', ', '.join(requested))
          PY

      - name: Run offline gates
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ runner.temp }}/ansible-collections
        run: |
          python tests/check_ansible.py
          python tests/check_compose.py

      - name: Connect Tailscale
        uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      - name: Write deploy credentials
        id: credentials
        env:
          VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          umask 077
          printf '%s\n' "$VAULT_PASSWORD" > .vault_pass
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 .vault_pass "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Deploy selected stacks
        id: deploy
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ runner.temp }}/ansible-collections
          ANSIBLE_VAULT_PASSWORD_FILE: ${{ github.workspace }}/.vault_pass
        run: |
          export ANSIBLE_PRIVATE_KEY_FILE="$HOME/.ssh/id_ed25519"
          ansible-playbook playbooks/docker.yml \
            --limit docker-1 \
            --tags compose \
            -e @extra_vars.json

      - name: Show container status
        if: always() && steps.credentials.outcome == 'success'
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ runner.temp }}/ansible-collections
          ANSIBLE_VAULT_PASSWORD_FILE: ${{ github.workspace }}/.vault_pass
        run: |
          export ANSIBLE_PRIVATE_KEY_FILE="$HOME/.ssh/id_ed25519"
          ansible -i inventory/hosts.ini docker -m command -a 'docker ps'

      - name: Remove deploy credentials
        if: always()
        run: |
          rm -f .vault_pass extra_vars.json "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
