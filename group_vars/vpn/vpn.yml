---
# VPN service configuration (roles: xui, caddy, vpn_backup).

# --- 3x-ui (native, no Docker) ---
# present = install if missing | latest = (re)install/upgrade |
# absent = uninstall | reinstalled = uninstall + install
xui_state: latest
# Pin a version ("v2.8.11") or leave empty for latest.
xui_version: "v3.6.0"
# absent: also remove /etc/x-ui (THE DATABASE — clients, keys, stats).
xui_purge: false

# Panel and subscription ports are proxied by Caddy via localhost;
# they are NOT exposed through UFW. Values must match the database
# settings (webPort / subPort) — the backup is authoritative.
# Tunnel ports: xui_tunnel_ports below.
xui_panel_port: 54321
xui_sub_port: 2096

# Inbound tunnels (VLESS Reality, Hysteria2, TUIC...) listen directly on
# their own ports — they are NOT proxied through Caddy. Opened in ufw
# (security.yml) and TCP-checked by the port monitor (UDP entries are
# skipped there: the check is a TCP connect). Ports must match the
# inbounds in the 3x-ui database.
xui_tunnel_ports:
  - { port: 8443, proto: tcp, comment: Reality }
  - { port: 9443, proto: tcp, comment: xhttp }
  # - { port: 8444, proto: udp, comment: Hysteria2 }

# Built-in 3x-ui fail2ban integration stays disabled (it is a DB
# setting); the system fail2ban service is used instead.

# --- Caddy ---
# HTTPS + Let's Encrypt + reverse proxy only. No Reality traffic here.
caddy_acme_email: "" # optional but recommended (expiry notices)
caddy_panel_domain: "{{ vault_panel_domain }}"
caddy_sub_domain: "{{ vault_sub_domain }}"
caddy_sites:
  - {
      domain: "{{ caddy_panel_domain }}",
      upstream_port: "{{ xui_panel_port }}",
      healthz: true,
    }
  - { domain: "{{ caddy_sub_domain }}", upstream_port: "{{ xui_sub_port }}" }

# --- Backups (stay on the VPS; another machine collects them) ---
vpn_backup_dir: /opt/vpn-backup
vpn_backup_retention_days: 14
vpn_backup_cron_hour: "3"
vpn_backup_cron_minute: "30"
