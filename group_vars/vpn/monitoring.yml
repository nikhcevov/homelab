---
# Monitoring configuration for the VPN VPS (deployed to
# /opt/homelab-monitoring/.env). ntfy topics and URL: group_vars/all/.
host_prefix: "[{{ inventory_hostname | upper }}]"

check_services: "x-ui caddy fail2ban cron ssh"
check_containers: ""
disk_threshold: 85
disk_mounts: "/"

# Backup freshness (cron runs nightly at 03:30).
backup_dir: "{{ vpn_backup_dir }}/archives"
backup_max_age_hours: 25
