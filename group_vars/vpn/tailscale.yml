---
# Tailscale mesh VPN (layer: network). VPN servers join so Unraid
# (great-hornbill) can pull /opt/vpn-backup over the tailnet instead of
# the public internet.

# Hostname shown in the tailnet (defaults to the inventory name).
tailscale_hostname: "{{ inventory_hostname }}"

# Auth key from the group vault (shared reusable key).
tailscale_auth_key: "{{ vault_tailscale_auth_key | default('') }}"

# These nodes only join the tailnet; they advertise and accept nothing.
tailscale_advertise_routes: ""
