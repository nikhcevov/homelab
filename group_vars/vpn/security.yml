---
# Firewall + intrusion prevention for the VPN VPS.

# --- UFW ---
ufw_default_incoming: deny
ufw_default_outgoing: allow
ufw_logging: low

# No stream proxy on this host — ports are listed explicitly.
ufw_open_service_ports: false

# SSH is opened automatically from sshd_port.
# Tunnel inbounds (Reality, Hysteria2, ...) listen directly on their own
# ports — NOT proxied through Caddy — so they are exposed here. Single
# definition: xui_tunnel_ports (group_vars/vpn/vpn.yml), appended below.
ufw_static_rules:
  - { port: 80, proto: tcp, comment: HTTP }
  - { port: 443, proto: tcp, comment: HTTPS }

ufw_rules: "{{ ufw_static_rules + xui_tunnel_ports }}"

# --- Fail2Ban ---
fail2ban_bantime: 1h
fail2ban_findtime: 10m
fail2ban_maxretry: 5
# Watch Caddy access log for repeated 401/403/404 (panel probing).
fail2ban_caddy_jail: true
