---
# Example vault for the vps group. Copy to vault.yml and fill in:
#   cp vault.example.yml vault.yml
# Real vault.yml is gitignored.

# Management IP of the edge VPS (used as ansible_host in inventory).
vault_vps_ip: "CHANGE_ME"

# Tailscale auth key: https://login.tailscale.com/admin/settings/keys
# Use a reusable, tagged key so role re-runs and rebuilds keep working.
vault_tailscale_auth_key: "tskey-auth-CHANGE_ME"

# ntfy topic names (treat as secrets — anyone knowing the topic can post).
vault_ntfy_topic_critical: "CHANGE_ME"
vault_ntfy_topic_alerts: "CHANGE_ME"
vault_ntfy_topic_info: "CHANGE_ME"
