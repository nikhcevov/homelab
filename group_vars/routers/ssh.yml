---
# Dropbear SSH configuration (role: openwrt_ssh).

ssh_dropbear_port: 22
# Listen on LAN only (empty = all interfaces). Set to the LAN address
# to keep SSH off the WAN side.
ssh_dropbear_interface: "lan"

# Public key files from files/ssh/ authorized for root.
# Public keys are NOT secrets, they belong in Git.
ssh_authorized_keys:
  - personal.pub
