---
# LAN, DHCP and DNS (role: openwrt_network).
# Deploys /etc/config/network and /etc/config/dhcp.

# Bridge ports depend on the device (DSA names). Adjust to your hardware:
#   ip link  # on the router
owrt_lan_bridge_ports:
  - lan1
  - lan2
  - lan3
  - lan4

# LAN addressing. owrt_lan_ip is per host (host_vars/), the rest is shared.
owrt_lan_netmask: "255.255.255.0"
owrt_lan_dns: "{{ owrt_dns_servers }}"

# WAN side: plain DHCP client.
# owrt_wan_mac spoofs the WAN device MAC — set it in host_vars when the
# ISP binds the lease to a specific MAC address.
# owrt_wan_mac: "50:ff:20:73:35:fd"
owrt_wan_device: wan
owrt_wan_proto: dhcp

# DHCP pool on LAN.
owrt_dhcp_start: 100
owrt_dhcp_limit: 150
owrt_dhcp_leasetime: 12h

# Static DHCP leases, rendered as `config host` sections. Per-host in
# host_vars when the reservations belong to one site's devices.
# owrt_dhcp_hosts:
#   - { name: unraid, ip: 192.168.100.20, mac: "ac:1f:6b:f4:a4:18" }
owrt_dhcp_hosts: []

# Spread packet processing across CPU cores (RPS). Free on multicore
# SoCs (MT7981), harmless on single-core.
owrt_packet_steering: true

# DNS: upstream resolvers dnsmasq forwards to, and the local domain.
owrt_dns_servers:
  - 9.9.9.9 # Quad9 DNS
  - 149.112.112.112 # Quad9 DNS
owrt_dns_domain: lan

# dnsmasq drops queries from non-local subnets at application level
# (localservice). That blocks DNS over the tailnet subnet route — sources
# are in 100.64.0.0/10. The firewall zones already gate who can reach
# dnsmasq at all (wan input REJECT), so the app-level check is redundant.
owrt_dns_localservice: false
