---
# Tailscale mesh VPN (role: tailscale, Arch branch).

# Hostname shown in the tailnet; matches the inventory name by convention.
tailscale_hostname: "{{ inventory_hostname }}"

# Auth key from the shared vault (group_vars/all/vault.yml). Normally not
# needed on workstations: day-0 is a manual `tailscale up` with the SSO
# login URL. Runs only while the node is unauthenticated.
tailscale_auth_key: "{{ vault_tailscale_auth_key | default('') }}"

tailscale_advertise_routes: ""

# Do NOT accept subnet routes by default: both machines are mostly at
# home, i.e. INSIDE the advertised segments (192.168.100.0/24 +
# 192.168.103.0/24) — accepted routes hijack locally-routed traffic into
# tailscale's table-52 path, which loops through the advertising router
# and dies. Enable per-host in host_vars only if a machine spends real
# time away from home and needs the remote segments.
tailscale_accept_routes: false
