---
# Base system configuration for the monitoring VPS.
# Target: Debian 13 / Ubuntu 24.04+, x86_64. Only Python 3 is preinstalled.

bootstrap_apt_upgrade: dist

bootstrap_timezone: Europe/Moscow
bootstrap_locale: en_US.UTF-8

bootstrap_packages:
  - sudo
  - curl
  - wget
  - git
  - ca-certificates
  - vim
  - htop
  - jq
  - rsync
  - unzip
  - gnupg
  - python3-apt
  - python3-debian # required by deb822_repository (caddy role)

bootstrap_unattended_upgrades: true
bootstrap_unattended_reboot: true
bootstrap_unattended_reboot_time: "04:00"

# Public SSH key files (from files/ssh/) authorized for the root login.
# Public keys are NOT secrets, they belong in Git.
bootstrap_root_ssh_keys:
  - starling.pub
  - great-hornbill.pub

# Optional non-root admin user.
bootstrap_admin_user: ""
bootstrap_admin_user_ssh_keys: []
