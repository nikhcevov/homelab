---
# KDE lock screen shows only the clock after wake until a keypress — and
# fprintd stays inactive until the password prompt appears, so stock
# unlocking is "open lid, press a key, THEN touch the sensor".
#
# This role used to patch LockScreenUi.qml so the prompt (and fprintd)
# came up the moment the lock screen LOADED. Bad idea: the lock screen
# loads on lid close, BEFORE sleep, so fprintd held the fingerprint
# reader open for the entire suspend — USB xHCI could never power-gate,
# the platform never entered S0ix and the battery drained overnight in
# s2idle (measured: slp_s0_residency_usec = 0, fprintd spawns at lock).
#
# Instead, kde-lock-raise.service is pulled in by suspend.target and its
# ExecStop fires right after resume, simulating user activity so the
# prompt (and fprintd) come up exactly when the lid opens. No QML patch,
# no pacman hook, nothing to break on plasma-workspace upgrades.

- name: Install the after-resume prompt-raise script
  ansible.builtin.template:
    src: kde-lock-raise.sh.j2
    dest: /usr/local/bin/kde-lock-raise
    owner: root
    group: root
    mode: "0755"

- name: Install the after-resume prompt-raise service
  ansible.builtin.template:
    src: kde-lock-raise.service.j2
    dest: /etc/systemd/system/kde-lock-raise.service
    owner: root
    group: root
    mode: "0644"

- name: Enable the after-resume prompt-raise service
  ansible.builtin.systemd_service:
    name: kde-lock-raise.service
    enabled: true
    daemon_reload: true

- name: Remove the old QML patch script and pacman hook
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/local/bin/kde-lock-immediate
    - /etc/pacman.d/hooks/kde-lock-immediate.hook

- name: Install the QML patch revert script
  ansible.builtin.template:
    src: kde-lock-immediate-revert.sh.j2
    dest: /usr/local/bin/kde-lock-immediate-revert
    owner: root
    group: root
    mode: "0755"

# The script prints "reverted ..." only when it actually edits the file.
- name: Revert the old QML patch if present
  ansible.builtin.command: /usr/local/bin/kde-lock-immediate-revert
  register: _kde_lock_immediate_revert
  changed_when: "'reverted' in _kde_lock_immediate_revert.stdout"
