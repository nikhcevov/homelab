---
docker_vm_user: boss
docker_vm_ssh_keys: []
docker_vm_nfs_server: ""
docker_vm_nfs_options: "rw,hard,_netdev,noatime,vers=4.1"
docker_vm_nfs_mounts: []
docker_vm_initialize_appdata: false
docker_vm_appdata_device: /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi1
docker_vm_appdata_path: /mnt/appdata
docker_vm_appdata_label: HOMELAB_APPDATA

# Initialization requires independent proof that PVE just allocated these disks.
docker_vm_initialize_data: false
docker_vm_data_disks: []
