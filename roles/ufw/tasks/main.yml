---
# Declarative firewall. Rules come from three sources, merged:
#   1. sshd_port (inventory/group_vars/edge_nodes/ssh.yml)      — SSH, always open
#   2. ufw_rules (inventory/group_vars/edge_nodes/security.yml) — static base rules
#   3. ufw_proxy_services listen ports        — supplied by the calling play
# Order matters: all allow rules are in place BEFORE ufw is enabled,
# so a first run never cuts the management connection.

- name: Require proxy services when automatic ports are enabled
  ansible.builtin.assert:
    that:
      - ufw_proxy_services is defined
      - ufw_proxy_services is mapping
    fail_msg: "Supply ufw_proxy_services as a services mapping when ufw_open_service_ports is enabled."
  when: ufw_open_service_ports | bool

- name: Install ufw
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true

- name: Set default policies
  community.general.ufw:
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
  loop:
    - { direction: incoming, policy: "{{ ufw_default_incoming }}" }
    - { direction: outgoing, policy: "{{ ufw_default_outgoing }}" }

- name: Set logging level
  community.general.ufw:
    logging: "{{ ufw_logging }}"

- name: Allow SSH (from sshd_port)
  community.general.ufw:
    rule: allow
    port: "{{ sshd_port }}"
    proto: tcp
    comment: SSH

- name: Allow base rules
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto | default('tcp') }}"
    comment: "{{ item.comment | default(omit) }}"
  loop: "{{ ufw_rules }}"
  loop_control:
    label: "{{ item.comment | default(item.port ~ '/' ~ (item.proto | default('tcp'))) }}"

# UFW identifies a rule by port/protocol, so applying the same listener with
# different comments on every run would keep changing that one rule.
- name: Build unique proxy listen ports not covered by base rules
  ansible.builtin.set_fact:
    _ufw_proxy_ports: >-
      {%- set ns = namespace(seen=[sshd_port | string ~ '/tcp'], ports=[]) -%}
      {%- for rule in ufw_rules -%}
      {%- set _ = ns.seen.append(rule.port | string ~ '/' ~ (rule.proto | default('tcp'))) -%}
      {%- endfor -%}
      {%- for item in ufw_proxy_services | dict2items -%}
      {%- set key = item.value.listen | string ~ '/' ~ (item.value.protocol | default('tcp')) -%}
      {%- if key not in ns.seen -%}
      {%- set _ = ns.seen.append(key) -%}
      {%- set _ = ns.ports.append(item) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ ns.ports }}
  when: ufw_open_service_ports | bool

- name: Allow proxy service listen ports
  community.general.ufw:
    rule: allow
    port: "{{ item.value.listen }}"
    proto: "{{ item.value.protocol | default('tcp') }}"
    comment: "proxy: {{ item.key }}"
  loop: "{{ _ufw_proxy_ports | default([]) }}"
  loop_control:
    label: "{{ item.key }}: {{ item.value.listen }}/{{ item.value.protocol | default('tcp') }}"
  when: ufw_open_service_ports | bool

- name: Enable ufw
  community.general.ufw:
    state: enabled
