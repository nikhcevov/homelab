---
# Base system for a fresh OpenWrt router: Python bootstrap (Ansible modules
# need it), hostname, timezone, NTP, sysctl.

# Chicken-and-egg: python3-light is not installed yet, so no Ansible module
# works. Install it via raw (OpenWrt 25.12+ uses apk); later runs see it
# present and skip apk update.
- name: Bootstrap python3-light
  ansible.builtin.raw: >-
    sh -c 'command -v python3 >/dev/null 2>&1 && echo present ||
    (apk update >/dev/null && apk add python3-light >/dev/null && echo installed)'
  register: _owrt_python
  changed_when: "'installed' in _owrt_python.stdout"
  failed_when: _owrt_python.rc != 0 and 'present' not in _owrt_python.stdout

# Facts were skipped at play start (no python on first contact); collect
# them now so service/sysctl modules can detect the init system.
- name: Gather facts
  ansible.builtin.setup:

- name: Deploy system config (hostname, timezone, NTP)
  ansible.builtin.template:
    src: system.j2
    dest: /etc/config/system
    mode: "0644"
    backup: true
  notify: Reload system config

- name: Deploy sysctl configuration
  ansible.builtin.template:
    src: sysctl.conf.j2
    dest: /etc/sysctl.conf
    mode: "0644"
  notify: Apply sysctl
