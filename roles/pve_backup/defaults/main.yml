---
pve_backup_enabled: false
pve_backup_bootstrap_known_hosts: false
pve_backup_ssh_private_key: "{{ vault_pve_backup_ssh_private_key }}"
pve_backup_known_hosts: ""
pve_backup_pbs_vmid: "{{ pve_pbs_id }}"
pve_backup_collector: /rpool/backup-staging/collector
pve_backup_collector_dataset: rpool/backup-staging/collector
pve_backup_id: pve-recovery
pve_backup_calendar: '*-*-* 07:15:00'
pve_backup_local_max_age_hours: 36
pve_backup_sync_max_age_hours: 36
pve_backup_sync_job: "{{ pve_pbs_sync_job }}"
pve_backup_vm_wait_seconds: 86400
# rsync preserves source mtimes. Match only completed upstream archive names;
# a recent unrelated file or successful transfer is not backup freshness.
# Daily sources publish before07:15; yesterday's scheduled archives exceed24h.
# A same-day delayed/manual collection must not fail a two-hour freshness window.
pve_backup_rsync_sources:
  - name: vpn-nl
    host: 100.100.146.5
    path: /opt/vpn-backup/archives/
    user: root
    rsync_path: rsync
    latest_pattern: vpn-backup-*.tar.gz
    latest_max_age_hours: 24
  - name: ha-krm
    host: 100.66.142.69
    path: /backup/
    user: boss
    rsync_path: sudo rsync
    latest_pattern: '*.tar'
    latest_max_age_hours: 24
pve_backup_router_retention_days: 30
pve_backup_routers:
  - {name: router-srt, host: 100.77.53.118}
  - {name: router-krm, host: 100.84.111.78}
  # router-evn/router-trvl is inactive by owner approval (2026-11-18).
  # Preserve its collector archives; re-add only after reachability and SSH-pin proof.
