---
pve_backup_enabled: false
# Prepare the first supervised checkpoint without arming timers.
pve_backup_provision: false
pve_backup_bootstrap_known_hosts: false
pve_backup_ssh_private_key: "{{ vault_pve_backup_ssh_private_key }}"
pve_backup_known_hosts: ""
pve_backup_guest_host: 10.77.0.2
pve_backup_pbs_vmid: 101
pve_backup_vault_mount: /mnt/vault
pve_backup_vault_uuid: ""
pve_backup_offsite_mount: /mnt/offsite
pve_backup_offsite_uuid: ""
pve_backup_collector: /tank/files/homelab-backups
pve_backup_staging_dataset: rpool/backup-staging/appdata
pve_backup_staging: /rpool/backup-staging/appdata
pve_backup_bulk_datasets:
  - dataset: tank/photos
    mount: /tank/photos
  - dataset: tank/files
    mount: /tank/files
pve_backup_snapshot_keep: 8
pve_backup_keep_daily: 7
pve_backup_keep_weekly: 8
pve_backup_keep_monthly: 6
pve_backup_offsite_max_age_days: 30
# Daily completion times vary; allow the next run's scan plus timer jitter.
pve_backup_local_max_age_hours: 36
pve_backup_collect_calendar: '*-*-* 01:00:00'
pve_backup_calendar: '*-*-* 03:00:00'
# Avoid the measured daily restic window and Sunday PBS verification.
pve_backup_check_calendar: '*-*-01 12:00:00'
pve_backup_check_subset: '10%'
pve_backup_rsync_sources:
  - {name: vpn-nl, host: 100.100.146.5, path: /opt/vpn-backup/archives/, user: root, rsync_path: rsync}
  - {name: mon-1, host: 100.107.77.74, path: /opt/kuma-backup/archives/, user: root, rsync_path: rsync}
  - {name: ha-krm, host: 100.66.142.69, path: /backup/, user: boss, rsync_path: 'sudo rsync'}
pve_backup_routers:
  - {name: router-srt, host: 100.77.53.118}
  - {name: router-krm, host: 100.84.111.78}
  - {name: router-trvl, host: 100.81.91.97}
pve_backup_router_retention_days: 30
# Only replaceable recordings are omitted, never Frigate config or SQLite DB.
pve_backup_rsync_excludes:
  - /frigate/media/recordings/
pve_backup_restic_excludes:
  - /photos/frigate/recordings
  - /appdata/frigate/media/recordings
