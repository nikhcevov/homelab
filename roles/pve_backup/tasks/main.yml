---

- name: Inspect old managed backup timers
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ item }}"
  loop:
    - homelab-backup.timer
    - homelab-backup-collect.timer
    - homelab-backup-check.timer
  register: _pve_backup_old_timers

- name: Disarm old schedules before replacing commands
  ansible.builtin.systemd:
    name: "{{ item.item }}"
    enabled: false
    state: stopped
  loop: "{{ _pve_backup_old_timers.results }}"
  when: item.stat.exists

- name: Inspect backup units before the PBS-only cutover
  ansible.builtin.service_facts:

- name: Refuse to replace an active backup transaction
  ansible.builtin.assert:
    that:
      - ansible_facts.services.get(item, {}).get('state', 'stopped') != 'running'
    fail_msg: Wait for the existing backup transaction to finish before applying the PBS-only role.
  loop:
    - homelab-backup.service
    - homelab-backup-collect.service
    - homelab-backup-check.service

- name: Inspect the preserved host recovery marker
  ansible.builtin.stat:
    path: /var/lib/homelab-backup/guest-needs-resume
  register: _pve_backup_recovery

- name: Require old cold transactions to be recovered before retirement
  ansible.builtin.assert:
    that: not _pve_backup_recovery.stat.exists
    fail_msg: A preserved guest-needs-resume marker exists. Recover and archive the old transaction manually before retiring its helpers.

- name: Require the preserved collector identity and native PBS interfaces
  ansible.builtin.assert:
    that:
      - vault_pve_backup_ssh_private_key is defined
      - pve_backup_ssh_private_key | length > 0
      - pve_pbs_datastore | length > 0
      - pve_pbs_secondary_datastore is string
      - pve_pbs_secondary_datastore | length == 0 or pve_pbs_datastore != pve_pbs_secondary_datastore
      - pve_backup_pbs_vmid | int == 101
      - pve_backup_vm_wait_seconds | int > 0
      - pve_pbs_secret_path is match('^/')
      - pve_backup_id is match('^[A-Za-z0-9][A-Za-z0-9_-]*$')
    fail_msg: Supply the preserved SSH identity and the existing native PBS configuration.
  no_log: true

- name: Require a complete source age policy
  ansible.builtin.assert:
    that:
      - item.name is match('^[A-Za-z0-9][A-Za-z0-9_-]*$')
      - item.latest_pattern | length > 0
      - "'/' not in item.latest_pattern"
      - item.latest_max_age_hours | int > 0
    fail_msg: Each source needs a safe name, completed archive glob and positive latest archive maximum age.
  loop: "{{ pve_backup_rsync_sources }}"
  loop_control:
    label: "{{ item.name }}"

- name: Install PBS filesystem backup utilities
  ansible.builtin.apt:
    name: [proxmox-backup-client, rsync, curl, openssh-client, sqlite3, python3]
    state: present

- name: Create protected backup installation directories without removing history
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop:
    - /etc/homelab-backup
    - /var/lib/homelab-backup
    - /var/lib/homelab-backup/recovery
    - /usr/local/lib/homelab-backup

- name: Require the already migrated collector dataset before enabling its timer
  ansible.builtin.command:
    argv: [findmnt, -n, -o, "FSTYPE,SOURCE,OPTIONS", --mountpoint, "{{ pve_backup_collector }}"]
  register: _pve_backup_collector_mount
  changed_when: false
  when: pve_backup_enabled | bool

- name: Reject fallback collector directories and read-only datasets
  ansible.builtin.assert:
    that:
      - _pve_backup_collector_mount.stdout.split()[0] == 'zfs'
      - _pve_backup_collector_mount.stdout.split()[1] == pve_backup_collector_dataset
      - "'ro' not in _pve_backup_collector_mount.stdout.split()[2].split(',')"
    fail_msg: Migrate the existing collector history to the configured mounted ZFS dataset before enabling backups.
  when: pve_backup_enabled | bool

- name: Protect the migrated collector without recursively changing archives
  ansible.builtin.file:
    path: "{{ pve_backup_collector }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: pve_backup_enabled | bool

- name: Preserve the existing collector SSH identity
  ansible.builtin.copy:
    content: "{{ pve_backup_ssh_private_key }}\n"
    dest: /etc/homelab-backup/id_ed25519
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Install explicitly supplied source SSH host pins
  ansible.builtin.blockinfile:
    path: /etc/homelab-backup/known_hosts
    create: true
    owner: root
    group: root
    mode: "0600"
    marker: "# {mark} preserved Unraid collector host keys"
    block: "{{ pve_backup_known_hosts }}"
  no_log: true

- name: Build the expected external collector SSH host list
  ansible.builtin.set_fact:
    _pve_backup_hosts: "{{ ((pve_backup_rsync_sources | map(attribute='host') | list) + (pve_backup_routers | map(attribute='host') | list)) | unique }}"

- name: Inspect existing pinned host entries
  ansible.builtin.command:
    argv: [ssh-keygen, -F, "{{ item }}", -f, /etc/homelab-backup/known_hosts]
  register: _pve_backup_pins
  changed_when: false
  failed_when: false
  loop: "{{ _pve_backup_hosts }}"

- name: Explicitly bootstrap missing SSH pins from expected hosts
  ansible.builtin.command:
    argv: [ssh-keyscan, -T, '10', -t, ed25519, "{{ item.item }}"]
  register: _pve_backup_scans
  changed_when: false
  loop: "{{ _pve_backup_pins.results }}"
  when:
    - pve_backup_bootstrap_known_hosts | bool
    - item.rc != 0

- name: Pin bootstrap results without changing any existing host key
  ansible.builtin.known_hosts:
    path: /etc/homelab-backup/known_hosts
    name: "{{ item.item.item }}"
    key: "{{ item.stdout }}"
    state: present
  loop: "{{ _pve_backup_scans.results }}"
  when: item.stdout is defined

- name: Require every collector SSH host to be pinned before activation
  ansible.builtin.command:
    argv: [ssh-keygen, -F, "{{ item }}", -f, /etc/homelab-backup/known_hosts]
  changed_when: false
  loop: "{{ _pve_backup_hosts }}"
  when: pve_backup_enabled | bool

- name: Install protected PBS backup commands
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "0700"
  loop:
    - {src: common.sh.j2, dest: /usr/local/lib/homelab-backup/common.sh}
    - {src: homelab-backup.j2, dest: /usr/local/sbin/homelab-backup}
    - {src: homelab-backup-collect.j2, dest: /usr/local/sbin/homelab-backup-collect}
    - {src: pbs-file-backup.py.j2, dest: /usr/local/lib/homelab-backup/pbs-file-backup}
  no_log: true

- name: Remove obsolete restic and independent collector schedules only
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}"
    state: absent
  loop:
    - homelab-backup-check.service
    - homelab-backup-check.timer
    - homelab-backup-collect.timer

- name: Install PBS file backup and freshness services
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - homelab-backup.service
    - homelab-backup.timer
    - homelab-backup-collect.service
    - homelab-backup-freshness.service
    - homelab-backup-freshness.timer
    - homelab-backup-failure@.service
  no_log: true

- name: Enable configured PBS file backup and freshness timers
  ansible.builtin.systemd:
    name: "{{ item }}"
    daemon_reload: true
    enabled: "{{ pve_backup_enabled | bool }}"
    state: "{{ 'started' if pve_backup_enabled | bool else 'stopped' }}"
  loop:
    - homelab-backup.timer
    - homelab-backup-freshness.timer
