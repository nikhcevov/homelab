---
# Dotfiles via chezmoi (inventory/group_vars/workstations/dotfiles.yml).
# init --apply clones the source repo into ~/.local/share/chezmoi and
# applies the target state; `chezmoi update` afterwards pulls + applies.
# Per-host differences live in chezmoi templates, not here.

- name: Install chezmoi
  ansible.builtin.pacman:
    name: chezmoi
    state: present

# The standalone chezmoi hook uses chsh, which needs user authentication.
# Provision the same shell as root before running noninteractive apply.
# fish is installed by arch_packages before this role.
- name: Set fish as the workstation login shell
  ansible.builtin.user:
    name: "{{ workstation_user }}"
    shell: /usr/bin/fish

# The config file is the source of truth for "initialized" — NOT the
# default ~/.local/share/chezmoi path: a machine whose chezmoi.toml sets
# sourceDir (a checkout used as the source, as the repository host may
# configure) is already initialized, and chezmoi update pulls into it.
- name: Check for an existing chezmoi config
  ansible.builtin.stat:
    path: "/home/{{ workstation_user }}/.config/chezmoi/chezmoi.toml"
  register: _chezmoi_config

# --force as below: a fresh GNOME install already ships files chezmoi
# manages (e.g. ~/.config/gtk-3.0/settings.ini) — don't prompt, overwrite.
# --no-tty: Ansible can allocate a pty for the remote session (observed with
# --ask-become-pass), which makes stdinIsATTY true inside chezmoi. The
# `.chezmoi.toml.tmpl` git-email promptStringOnce then writes its prompt to the
# stdout Ansible captured and blocks on a /dev/pts nobody is typing into — the
# task hangs indefinitely (seen on starling, ~17 min). --no-tty forces the
# non-interactive branch (default email), which matches the personal default.
- name: Initialize and apply dotfiles
  ansible.builtin.command: chezmoi --no-tty init --apply --force "{{ dotfiles_chezmoi_repo }}"
  become_user: "{{ workstation_user }}"
  environment:
    HOME: "/home/{{ workstation_user }}"
    SHELL: /usr/bin/fish
  when: not _chezmoi_config.stat.exists

# Pull + apply on every run (git pull inside the configured sourceDir).
# Always reported as ok: chezmoi's output does not tell us reliably what
# changed (same convention as the tailscale role's `tailscale set`).
# --force: overwrite files modified locally since the last apply (GTK
# rewrites ~/.config/gtk-3.0/settings.ini at runtime) instead of prompting
# — there is no TTY under Ansible, so a prompt means a failed run.
# The dotfiles repo is the source of truth by design.
- name: Update and apply dotfiles
  ansible.builtin.command: chezmoi --no-tty update --force
  become_user: "{{ workstation_user }}"
  environment:
    HOME: "/home/{{ workstation_user }}"
    SHELL: /usr/bin/fish
  changed_when: false
  when: _chezmoi_config.stat.exists
