---
# Caddy: HTTPS termination, Let's Encrypt, reverse proxy.
# Reality traffic is NOT here — it listens on its own port directly.

- name: Install Caddy APT repository key
  ansible.builtin.get_url:
    url: https://dl.cloudsmith.io/public/caddy/stable/gpg.key
    dest: /usr/share/keyrings/caddy-stable-archive-keyring.gpg
    mode: "0644"

- name: Add Caddy APT repository
  ansible.builtin.deb822_repository:
    name: caddy-stable
    types: deb
    uris: https://dl.cloudsmith.io/public/caddy/stable/deb/debian
    suites: any-version
    components: main
    signed_by: /usr/share/keyrings/caddy-stable-archive-keyring.gpg
    state: present

- name: Install caddy
  ansible.builtin.apt:
    name: caddy
    state: present
    update_cache: true

- name: Ensure access log directory exists
  ansible.builtin.file:
    path: /var/log/caddy
    state: directory
    owner: caddy
    group: caddy
    mode: "0755"

# The file may pre-exist as root:root 0600 (e.g. from postinst or a
# partial earlier setup); caddy then fails to open it on reload.
# touch + preserve: create if missing, fix owner if present, idempotent.
- name: Ensure access log file is writable by caddy
  ansible.builtin.file:
    path: /var/log/caddy/access.log
    state: touch
    modification_time: preserve
    access_time: preserve
    owner: caddy
    group: caddy
    mode: "0644"

# In check mode on a fresh node caddy is not installed yet — the
# validate wrapper then no-ops instead of failing.
- name: Deploy Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    mode: "0644"
    validate: /bin/sh -c 'command -v caddy >/dev/null 2>&1 && exec caddy validate --adapter caddyfile --config %s || true'
  notify: Reload caddy

- name: Ensure caddy is running and enabled
  ansible.builtin.service:
    name: caddy
    state: started
    enabled: true
  when: not ansible_check_mode
