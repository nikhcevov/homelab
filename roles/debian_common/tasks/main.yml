---
# Debian-family (Debian/Ubuntu) baseline: updates, base packages, timezone,
# locale, unattended-upgrades, optional admin user.

# No cache_valid_time: fresh provider images may ship empty lists
# with a fresh timestamp, which makes every package "not available".
- name: Update apt cache and upgrade installed packages
  ansible.builtin.apt:
    update_cache: true
    upgrade: "{{ bootstrap_apt_upgrade }}"

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ bootstrap_packages }}"
    state: present

- name: Reconcile explicitly enabled systemd time synchronization
  when: bootstrap_timesyncd_enabled | default(false) | bool
  tags: [time_sync]
  block:
    - name: Install the configured time synchronization daemon
      ansible.builtin.apt:
        name: systemd-timesyncd
        state: present
        update_cache: true
        install_recommends: false

    - name: Enable persistent time synchronization
      ansible.builtin.systemd_service:
        name: systemd-timesyncd
        enabled: true
        state: started

- name: Set timezone
  community.general.timezone:
    name: "{{ bootstrap_timezone }}"

- name: Generate locale
  community.general.locale_gen:
    name: "{{ bootstrap_locale }}"
    state: present

- name: Set default locale
  ansible.builtin.lineinfile:
    path: /etc/default/locale
    regexp: ^LANG=
    line: "LANG={{ bootstrap_locale }}"
    create: true
    mode: "0644"

- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present
  when: bootstrap_unattended_upgrades | bool

- name: Enable automatic updates
  ansible.builtin.template:
    src: 20auto-upgrades.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
  when: bootstrap_unattended_upgrades | bool

- name: Configure unattended-upgrades
  ansible.builtin.template:
    src: 50unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    mode: "0644"
  when: bootstrap_unattended_upgrades | bool

# Proxmox's pmxcfs rejects chown; preserve linked-store ownership and update content only.
- name: Authorize root SSH keys without replacing managed stores
  when: bootstrap_root_ssh_keys | length > 0
  tags: [ssh_keys]
  block:
    - name: Ensure the private root SSH directory exists
      ansible.builtin.file:
        path: /root/.ssh
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Resolve the existing root SSH key store
      ansible.builtin.stat:
        path: /root/.ssh/authorized_keys
        follow: false
        get_checksum: false
        get_mime: false
        get_attributes: false
      register: _root_ssh_key_store

    - name: Add controller keys without changing native-store ownership
      ansible.builtin.lineinfile:
        path: "{{ _root_ssh_key_store.stat.lnk_source | default('/root/.ssh/authorized_keys') }}"
        line: "{{ lookup('ansible.builtin.file', role_path + '/../../files/ssh/' + item) }}"
        create: true
        mode: "0600"
      loop: "{{ bootstrap_root_ssh_keys }}"

- name: Create admin user
  ansible.builtin.user:
    name: "{{ bootstrap_admin_user }}"
    shell: /bin/bash
    groups: sudo
    append: true
    create_home: true
  when: bootstrap_admin_user | length > 0

- name: Authorize admin user SSH keys
  ansible.posix.authorized_key:
    user: "{{ bootstrap_admin_user }}"
    key: "{{ item }}"
    exclusive: true
  loop: "{{ bootstrap_admin_user_ssh_keys }}"
  when:
    - bootstrap_admin_user | length > 0
    - bootstrap_admin_user_ssh_keys | length > 0
