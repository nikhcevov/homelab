---
# Install fail2ban with a systemd-backend sshd jail.

- name: Install fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: present
    update_cache: true

- name: Deploy jail configuration
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: "0644"
  notify: Restart fail2ban

- name: Deploy Caddy filter
  ansible.builtin.template:
    src: caddy-4xx.conf.j2
    dest: /etc/fail2ban/filter.d/caddy-4xx.conf
    mode: "0644"
  notify: Restart fail2ban
  when: fail2ban_caddy_jail | bool

# In check mode the package above is not actually installed,
# so the unit does not exist yet and this task would fail.
- name: Ensure fail2ban is running and enabled
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true
  when: not ansible_check_mode
