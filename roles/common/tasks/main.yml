---
# Bootstrap a fresh Debian 12 node: updates, base packages, timezone,
# locale, unattended-upgrades, optional admin user.

# No cache_valid_time: fresh provider images may ship empty lists
# with a fresh timestamp, which makes every package "not available".
- name: Update apt cache and upgrade installed packages
  ansible.builtin.apt:
    update_cache: true
    upgrade: "{{ bootstrap_apt_upgrade }}"

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ bootstrap_packages }}"
    state: present

- name: Set timezone
  community.general.timezone:
    name: "{{ bootstrap_timezone }}"

- name: Generate locale
  community.general.locale_gen:
    name: "{{ bootstrap_locale }}"
    state: present

- name: Set default locale
  ansible.builtin.lineinfile:
    path: /etc/default/locale
    regexp: ^LANG=
    line: "LANG={{ bootstrap_locale }}"
    create: true
    mode: "0644"

- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present
  when: bootstrap_unattended_upgrades | bool

- name: Enable automatic updates
  ansible.builtin.template:
    src: 20auto-upgrades.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
  when: bootstrap_unattended_upgrades | bool

- name: Configure unattended-upgrades
  ansible.builtin.template:
    src: 50unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    mode: "0644"
  when: bootstrap_unattended_upgrades | bool

- name: Authorize root SSH keys
  ansible.posix.authorized_key:
    user: root
    key: "{{ item }}"
  loop: "{{ bootstrap_root_ssh_keys }}"
  when: bootstrap_root_ssh_keys | length > 0

- name: Create admin user
  ansible.builtin.user:
    name: "{{ bootstrap_admin_user }}"
    shell: /bin/bash
    groups: sudo
    append: true
    create_home: true
  when: bootstrap_admin_user | length > 0

- name: Authorize admin user SSH keys
  ansible.posix.authorized_key:
    user: "{{ bootstrap_admin_user }}"
    key: "{{ item }}"
    exclusive: true
  loop: "{{ bootstrap_admin_user_ssh_keys }}"
  when:
    - bootstrap_admin_user | length > 0
    - bootstrap_admin_user_ssh_keys | length > 0
