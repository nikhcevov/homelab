---
- name: Restart node_exporter
  ansible.builtin.systemd:
    name: node_exporter
    state: restarted
    daemon_reload: true

- name: Restart smartctl_exporter
  ansible.builtin.systemd:
    name: smartctl_exporter
    state: restarted
    daemon_reload: true

- name: Restart alloy
  ansible.builtin.systemd:
    name: alloy
    state: restarted
    daemon_reload: true
