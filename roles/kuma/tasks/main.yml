---
# Native Uptime Kuma (no Docker): Node.js + git checkout pinned by
# kuma_version + systemd unit. Listens on localhost only — Caddy
# proxies to it. Kuma's own config (monitors, notifications) lives in
# its SQLite DB (kuma_dir/data) and is managed via the UI.

- name: Install Node.js runtime
  ansible.builtin.apt:
    name:
      - nodejs
      - npm
    state: present
    update_cache: true

# create_home: false — the home path IS the app directory, which the
# git task below must be able to clone into (it refuses non-empty dirs).
- name: Create kuma system user
  ansible.builtin.user:
    name: kuma
    system: true
    home: "{{ kuma_dir }}"
    create_home: false
    shell: /usr/sbin/nologin

# Source is fetched and built as the kuma user, so the whole tree is
# owned correctly from the start (no recursive chown over node_modules,
# no git "dubious ownership" conflicts with root).
- name: Fetch Uptime Kuma source
  become_user: kuma
  ansible.builtin.git:
    repo: https://github.com/louislam/uptime-kuma.git
    dest: "{{ kuma_dir }}"
    version: "{{ kuma_version }}"
    depth: 1
  register: _kuma_src

- name: Check for built frontend
  ansible.builtin.stat:
    path: "{{ kuma_dir }}/dist/index.html"
  register: _kuma_dist

# Official setup: npm ci --production + download-dist (prebuilt
# frontend). Also runs when a previous/killed run left dist missing.
- name: Install kuma dependencies and frontend
  become_user: kuma
  ansible.builtin.command: npm run setup
  args:
    chdir: "{{ kuma_dir }}"
  when: _kuma_src.changed or not _kuma_dist.stat.exists
  notify: Restart kuma

- name: Ensure kuma data directory exists
  ansible.builtin.file:
    path: "{{ kuma_dir }}/data"
    state: directory
    owner: kuma
    group: kuma
    mode: "0750"

- name: Deploy kuma systemd unit
  ansible.builtin.template:
    src: kuma.service.j2
    dest: /etc/systemd/system/kuma.service
    mode: "0644"
  notify: Restart kuma

- name: Ensure kuma is running and enabled
  ansible.builtin.service:
    name: kuma
    state: started
    enabled: true
  when: not ansible_check_mode
