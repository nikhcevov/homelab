---
# Harden sshd via a drop-in. Debian 12 ships an Include of
# /etc/ssh/sshd_config.d/*.conf at the top of sshd_config, and for most
# options the first obtained value wins — so the 00- prefix takes
# precedence over cloud-init and package defaults.

- name: Ensure sshd drop-in directory exists
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    mode: "0755"

# Arch generates host keys on first sshd start (sshdgenkeys.service), so
# on a never-started sshd there are none — and the template validation
# below (`sshd -t`) refuses to run without them. ssh-keygen -A creates
# only the missing key types, so it is safe to run every time.
- name: Generate sshd host keys (Arch)
  ansible.builtin.command: ssh-keygen -A
  register: _ssh_hostkeys
  changed_when: _ssh_hostkeys.stdout | length > 0
  when: ansible_os_family == "Archlinux"

- name: Deploy sshd hardening drop-in
  ansible.builtin.template:
    src: sshd_hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/00-ansible-hardening.conf
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

- name: Ensure ssh is running and enabled
  ansible.builtin.service:
    name: "{{ ssh_service_name }}"
    state: started
    enabled: true
