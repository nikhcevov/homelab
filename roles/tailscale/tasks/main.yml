---
# Install and reconcile Tailscale. Upstreams in vars/proxy.yml use
# MagicDNS names, so the node must join the tailnet before the proxy
# layer is useful.
#
# Joining is a manual day-0 step (see README "First run"): the package
# is already installed by the time the auth check runs, so `tailscale up`
# on the host is all that's left. vault_tailscale_auth_key remains as an
# optional unattended path.
#
# Idempotency: `tailscale up` runs only when the backend is NOT in the
# Running state (fresh node or logged out). An already-authorized node
# gets its settings reconciled via `tailscale set`, which never touches
# auth — important because auth keys are usually single-use.

- name: Install Tailscale APT repository key
  ansible.builtin.get_url:
    url: https://pkgs.tailscale.com/stable/debian/bookworm.noarmor.gpg
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    mode: "0644"

- name: Add Tailscale APT repository
  ansible.builtin.deb822_repository:
    name: tailscale
    types: deb
    uris: https://pkgs.tailscale.com/stable/debian
    suites: bookworm
    components: main
    signed_by: /usr/share/keyrings/tailscale-archive-keyring.gpg
    state: present

- name: Install tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: true

- name: Ensure tailscaled is running and enabled
  ansible.builtin.service:
    name: tailscaled
    state: started
    enabled: true

- name: Check tailscale backend state
  ansible.builtin.command: tailscale status --json
  register: _tailscale_status
  changed_when: false
  failed_when: false

# When the node is not logged in, `tailscale status` exits non-zero and may
# print plain text instead of JSON — the rc != 0 branch short-circuits the
# `or`, so from_json never sees that output.
- name: Authenticate node to the tailnet
  ansible.builtin.command: >-
    tailscale up
    --auth-key={{ tailscale_auth_key }}
    --hostname={{ tailscale_hostname }}
    {% if tailscale_advertise_routes | length > 0 %}
    --advertise-routes={{ tailscale_advertise_routes }}
    {% endif %}
    {% if tailscale_accept_routes | default(false) | bool %}
    --accept-routes
    {% endif %}
    {% if tailscale_advertise_exit_node | default(false) | bool %}
    --advertise-exit-node
    {% endif %}
    {% if tailscale_exit_node | default('') | length > 0 %}
    --exit-node={{ tailscale_exit_node }}
    {% if tailscale_exit_node_allow_lan_access | default(false) | bool %}
    --exit-node-allow-lan-access
    {% endif %}
    {% endif %}
  no_log: true
  when:
    - tailscale_auth_key | length > 0
    - _tailscale_status.rc != 0 or
      (_tailscale_status.stdout | from_json).BackendState != "Running"

- name: Fail when the node is not authenticated and no auth key is set
  ansible.builtin.fail:
    msg: >-
      {{ tailscale_hostname }} is not in the tailnet. Day-0 step (once,
      manually): SSH to the host and run `tailscale up` — the package is
      already installed by this role. Open the login URL, then disable
      key expiry for the node in the Tailscale admin console (Machines ->
      node -> Disable key expiry), otherwise the node drops off the
      tailnet after 180 days. Re-run this playbook afterwards.
      Unattended alternative: set vault_tailscale_auth_key in the vault.
  when:
    - tailscale_auth_key | length == 0
    - _tailscale_status.rc != 0 or
      (_tailscale_status.stdout | from_json).BackendState != "Running"

# Reconcile settings on an authorized node without re-authenticating.
# Always reported as ok: `tailscale set` does not tell us what changed.
- name: Apply tailscale settings (hostname, advertised routes, exit node)
  ansible.builtin.command: >-
    tailscale set
    --hostname={{ tailscale_hostname }}
    --advertise-routes={{ tailscale_advertise_routes }}
    --accept-routes={{ tailscale_accept_routes | default(false) | bool }}
    --advertise-exit-node={{ tailscale_advertise_exit_node | default(false) | bool }}
    --exit-node={{ tailscale_exit_node | default('') }}
    --exit-node-allow-lan-access={{ tailscale_exit_node_allow_lan_access | default(false) | bool }}
  changed_when: false
  when:
    - _tailscale_status.rc == 0
    - (_tailscale_status.stdout | from_json).BackendState == "Running"
